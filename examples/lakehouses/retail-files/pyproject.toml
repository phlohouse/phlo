[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
description = "Retail Files blueprint: a production-shaped, network-independent retail lakehouse project template for phlo"
name = "phlo-retail-files"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"
dependencies = [
    "phlo[defaults]==0.16.0",
    "phlo-dagster==0.16.0",
    "phlo-dbt==0.15.2",
    "pandas>=2.3,<3.1",
    "pyarrow>=21,<26",
]

[project.entry-points."phlo.project_templates"]
retail_files = "phlo_retail_files.provider:templates"

[dependency-groups]
dev = [
    "phlo-pandera==0.15.2",
    "duckdb>=1.4,<1.6",
    "dbt-duckdb>=1.10,<1.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/phlo_retail_files"]

[tool.hatch.build.targets.sdist]
include = ["src/phlo_retail_files", "README.md"]
