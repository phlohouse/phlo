services:
  regions-postgres:
    image: postgres:16-alpine
    container_name: delta-portability-source-postgres
    ports:
      - "10732:5432"
    environment:
      POSTGRES_USER: delta
      POSTGRES_PASSWORD: delta
      POSTGRES_DB: delta
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delta -d delta"]
      interval: 2s
      timeout: 3s
      retries: 30
