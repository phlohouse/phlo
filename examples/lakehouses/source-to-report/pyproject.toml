[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "source-to-report"
version = "0.1.0"
description = "Reference Phlo lakehouse: source to evidence, insight, analysis and a report"
requires-python = ">=3.12,<3.14"
dependencies = [
    "phlo[defaults]==0.19.0",
    "phlo-dagster==0.19.0",
    "phlo-dlt==0.18.0",
    "phlo-dbt==0.18.0",
    "phlo-iceberg==0.18.0",
    "phlo-pandera==0.17.0",
    "phlo-trino==0.18.0",
    "dlt>=1.20,<2",
    "dbt-duckdb>=1.9,<2",
    "duckdb>=1.4,<1.6",
    "jinja2>=3.1",
    "pandas>=2.3.3,<3.1",
    "altair>=5.5,<6",
    "vl-convert-python>=1.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff",
]

[project.scripts]
source-to-report = "source_to_report.cli:main"
youtube-insights = "source_to_report.youtube.runner:main"

[project.entry-points."phlo.plugins.assets"]
source_to_report = "workflows.plugin:SourceToReportAssets"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["source_to_report*", "workflows*"]

[tool.setuptools.package-data]
"source_to_report.domain" = ["*.html.j2", "*.css"]
"source_to_report.youtube" = ["*.html.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: runs the full lakehouse build",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "RET", "C4", "PIE", "B", "DTZ", "PTH"]
ignore = ["E501"]

# Resolve Phlo providers from this checkout, including unpublished versions.
[tool.uv.sources]
phlo = { path = "../../..", editable = true }
phlo-api = { path = "../../../packages/phlo-api", editable = true }
phlo-core-plugins = { path = "../../../packages/phlo-core-plugins", editable = true }
phlo-dagster = { path = "../../../packages/phlo-dagster", editable = true }
phlo-dbt = { path = "../../../packages/phlo-dbt", editable = true }
phlo-dlt = { path = "../../../packages/phlo-dlt", editable = true }
phlo-iceberg = { path = "../../../packages/phlo-iceberg", editable = true }
phlo-minio = { path = "../../../packages/phlo-minio", editable = true }
phlo-nessie = { path = "../../../packages/phlo-nessie", editable = true }
phlo-observatory = { path = "../../../packages/phlo-observatory", editable = true }
phlo-observe-plugin = { path = "../../../packages/phlo-observe-plugin", editable = true }
phlo-pandera = { path = "../../../packages/phlo-pandera", editable = true }
phlo-postgres = { path = "../../../packages/phlo-postgres", editable = true }
phlo-sling = { path = "../../../packages/phlo-sling", editable = true }
phlo-trino = { path = "../../../packages/phlo-trino", editable = true }
