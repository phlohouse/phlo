[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phlo-wap-failure-lab-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "phlo[defaults]==0.17.1",
    "phlo-dagster==0.17.1",
    "phlo-dlt==0.16.1",
    "phlo-dbt==0.16.1",
    "phlo-iceberg==0.16.1",
    "phlo-trino==0.16.1",
    "dlt[filesystem]>=1.20,<2",
    "pandas>=2.3,<3.1",
    "pyarrow>=21,<26",
]

[dependency-groups]
dev = [
    "dbt-trino>=1.10,<1.12",
    "duckdb>=1.4,<1.6",
    "phlo-pandera==0.16.1",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
include = ["scripts*", "workflows*"]
