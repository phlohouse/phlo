name: wap-failure-lab
description: Write-Audit-Publish scenario lab covering branch lifecycle, blocking versus warning checks, retries, additive schema change, and concurrent runs

env:
  PHLO_PROJECT: wap-failure-lab
  # Namespace dbt-derived asset keys with the dbt project name so the lab emits
  # a multi-segment key (wap_failure_lab.batch_summary) for identity/encoding
  # acceptance coverage.
  DBT_NAMESPACED_ASSET_KEYS: "true"

capabilities:
  defaults:
    catalog: nessie
    table_store: iceberg
    query_engine: trino

wap:
  enabled: true
  job_name: wap_failure_lab_wap_job
  repository_location_name: phlo_dagster.framework.definitions
  repository_name: __repository__
