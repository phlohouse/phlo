services:
  logistics-postgres:
    image: postgres:16-alpine
    container_name: logistics-source-postgres
    ports:
      - "10332:5432"
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
      POSTGRES_DB: logistics
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics"]
      interval: 2s
      timeout: 3s
      retries: 30
