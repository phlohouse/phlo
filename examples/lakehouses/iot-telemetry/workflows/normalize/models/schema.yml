version: 2

sources:
  - name: iot_raw
    description: Raw tables appended or merged by the ingest-stage DLT assets.
    schema: raw
    tables:
      - name: telemetry_readings
        identifier: telemetry_readings
        meta:
          phlo_asset_key: dlt_telemetry_readings
      - name: telemetry_corrections
        identifier: telemetry_corrections
        meta:
          phlo_asset_key: dlt_telemetry_corrections
      - name: device_registry
        identifier: device_registry
        meta:
          phlo_asset_key: dlt_device_registry
      - name: site_directory
        identifier: site_directory
        meta:
          phlo_asset_key: dlt_site_directory

models:
  - name: stg_devices
    config:
      meta:
        phlo/layer: silver
        owner: fleet-management
        sla:
          freshness_hours: 192
          quality_threshold: 1.0
    columns:
      - name: device_id
        tests: [unique, not_null]
      - name: site_id
        tests: [not_null]
  - name: stg_sites
    config:
      meta:
        phlo/layer: silver
        owner: facilities
        sla:
          freshness_hours: 744
          quality_threshold: 1.0
    columns:
      - name: site_id
        tests: [unique, not_null]
  - name: telemetry_dedup
    description: One row per message with corrections overlaid; arrived_late flags stragglers.
    config:
      meta:
        phlo/layer: silver
        owner: fleet-operations
        sla:
          freshness_hours: 4
          quality_threshold: 0.995
    columns:
      - name: message_id
        tests: [unique, not_null]
      - name: event_hour
        tests: [not_null]
      - name: arrived_late
        tests: [not_null]
