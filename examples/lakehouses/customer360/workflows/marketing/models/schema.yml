version: 2

sources:
  - name: marketing_raw
    description: Raw marketing contacts and consent events merged by DLT.
    schema: raw
    tables:
      - name: raw_contacts
        identifier: marketing_contacts
        meta:
          phlo_asset_key: dlt_marketing_contacts
      - name: raw_consent_events
        identifier: consent_events
        meta:
          phlo_asset_key: dlt_consent_events

models:
  - name: stg_marketing_contacts
    columns:
      - name: observed_email
        tests: [unique, not_null]
  - name: stg_consent_events
    columns:
      - name: event_key
        tests: [unique, not_null]
  - name: consent_current
    description: Latest consent event per canonical email; latest occurred_at wins.
    columns:
      - name: canonical_email
        tests: [unique, not_null]
      - name: consent_status
        tests: [not_null]
