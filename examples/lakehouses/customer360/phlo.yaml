name: customer360
description: Domain-colocated customer lakehouse where commerce, support, and marketing each own ingestion, quality, and SQL models; one central dbt project compiles all three model roots into an identity-resolved, consent-gated Customer 360.

env:
  PHLO_PROJECT: customer360
  COMMERCE_SOURCE_URL: postgresql://commerce:commerce@host.docker.internal:10432/commerce?sslmode=disable
  SUPPORT_API_URL: http://host.docker.internal:8093/v1

services:
  dagster:
    extra_hosts:
      - host.docker.internal:host-gateway
  dagster-daemon:
    extra_hosts:
      - host.docker.internal:host-gateway

capabilities:
  defaults:
    table_store: iceberg
    query_engine: trino

wap:
  enabled: true
  job_name: customer360_wap_job
  repository_location_name: phlo_dagster.framework.definitions
  repository_name: __repository__
