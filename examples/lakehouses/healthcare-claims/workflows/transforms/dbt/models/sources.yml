        identifier: claims
        meta:
          phlo_asset_key: dlt_claims
      - name: eligibility_periods
        identifier: eligibility_periods
        meta:
          phlo_asset_key: dlt_eligibility_periods
      - name: providers
        identifier: providers
        meta:
          phlo_asset_key: dlt_providers
