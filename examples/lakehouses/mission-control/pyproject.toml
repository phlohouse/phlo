[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phlo-mission-control-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "phlo==0.19.0",
    "phlo-api==0.19.0",
    "phlo-core-plugins==0.16.2",
    "phlo-dagster==0.19.0",
    "phlo-dlt==0.18.0",
    "phlo-iceberg==0.18.0",
    "phlo-minio==0.18.0",
    "phlo-nessie==0.18.0",
    "phlo-observatory==0.19.0",
    "phlo-pandera==0.17.0",
    "phlo-postgres==0.18.0",
    "phlo-transform==0.2.0",
    "phlo-trino==0.18.0",
    "pandas>=2.3,<3.1",
    "pyarrow>=26,<27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
include = ["workflows*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

# Every Phlo distribution resolves to this checkout, including transitive providers.
