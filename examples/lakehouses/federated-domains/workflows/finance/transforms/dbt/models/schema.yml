version: 2

sources:
  - name: finance_raw
    description: Raw tables appended or merged by the finance-domain DLT assets.
    schema: raw
    tables:
      - name: finance_invoices
        identifier: finance_invoices
        meta:
          phlo_asset_key: dlt_finance_invoices

  # Cross-domain declaration: the sales ingestion asset is owned by the
  # sales_domain project, not by this manifest. phlo_asset_key maps it to the
  # shared asset graph; no ref() can reach a foreign model.
  - name: sales_raw
    description: Sales-domain raw table consumed across projects (see FEDERATION_FINDINGS.md).
    schema: raw
    tables:
      - name: sales_deals
        identifier: sales_deals
        meta:
          phlo_asset_key: dlt_sales_deals

models:
  - name: invoice_aging
    description: Invoice counts and outstanding value per aging bucket.
    columns:
      - name: aging_bucket
        tests: [not_null]
      - name: invoice_count
        tests: [not_null]
