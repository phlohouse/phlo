services:
  commerce-postgres:
    image: postgres:16-alpine
    container_name: commerce-source-postgres
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: commerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 2s
      timeout: 3s
      retries: 30
