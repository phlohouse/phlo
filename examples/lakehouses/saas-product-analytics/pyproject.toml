[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phlo-saas-product-analytics-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "phlo[defaults]==0.18.0",
    "phlo-dagster==0.18.0",
    "phlo-dbt==0.17.0",
    "dlt[filesystem]>=1.20,<2",
    "pandas>=2.3,<3.1",
    "pyarrow>=26,<27",
]

[dependency-groups]
dev = [
    "dbt-trino>=1.10,<1.12",
    "duckdb>=1.4,<1.6",
    "phlo-pandera==0.16.1",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
include = ["scripts*", "workflows*"]

# Resolve Phlo providers from this checkout, including unpublished versions.
[tool.uv.sources]
phlo = { path = "../../..", editable = true }
phlo-api = { path = "../../../packages/phlo-api", editable = true }
phlo-core-plugins = { path = "../../../packages/phlo-core-plugins", editable = true }
phlo-dagster = { path = "../../../packages/phlo-dagster", editable = true }
phlo-dbt = { path = "../../../packages/phlo-dbt", editable = true }
phlo-dlt = { path = "../../../packages/phlo-dlt", editable = true }
phlo-iceberg = { path = "../../../packages/phlo-iceberg", editable = true }
phlo-minio = { path = "../../../packages/phlo-minio", editable = true }
phlo-nessie = { path = "../../../packages/phlo-nessie", editable = true }
phlo-observatory = { path = "../../../packages/phlo-observatory", editable = true }
phlo-observe-plugin = { path = "../../../packages/phlo-observe-plugin", editable = true }
phlo-pandera = { path = "../../../packages/phlo-pandera", editable = true }
phlo-postgres = { path = "../../../packages/phlo-postgres", editable = true }
phlo-trino = { path = "../../../packages/phlo-trino", editable = true }
