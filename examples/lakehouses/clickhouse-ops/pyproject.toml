[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phlo-clickhouse-ops-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "phlo[defaults]==0.16.2",
    "phlo-dagster==0.16.2",
    "phlo-dlt==0.15.4",
    "phlo-dbt==0.15.4",
    "phlo-sling==0.15.4",
    "phlo-clickhouse==0.15.4",
    "dbt-clickhouse>=1.10,<1.11",
    "dlt[filesystem]>=1.20,<2",
    "pandas>=2.3,<3.1",
    "pyarrow>=21,<26",
    "psycopg2-binary>=2.9,<3.1",
]

[dependency-groups]
dev = [
    "duckdb>=1.4,<1.6",
    "phlo-pandera==0.15.4",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
include = ["scripts*", "workflows*"]
