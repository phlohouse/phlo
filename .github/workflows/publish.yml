name: Build Package Artifacts

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Optional comma-separated package names to build"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"

      - name: Set up Python
        run: uv python install 3.11

      - name: Determine packages and build
        env:
          PACKAGES_INPUT: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          mkdir -p dist

          build_package() {
            local pkg_dir="$1"
            echo "::group::Building $pkg_dir"
            uv build "$pkg_dir" --out-dir dist
            echo "::endgroup::"
          }

          if [ -n "$PACKAGES_INPUT" ]; then
            # Build only the explicitly listed packages
            IFS=',' read -ra PKGS <<< "$PACKAGES_INPUT"
            for pkg in "${PKGS[@]}"; do
              pkg="$(echo "$pkg" | xargs)"  # trim whitespace
              if [ "$pkg" = "phlo" ]; then
                build_package "."
              elif [ -d "packages/$pkg" ]; then
                build_package "packages/$pkg"
              else
                echo "::error::Package directory not found: packages/$pkg"
                exit 1
              fi
            done
          else
            # Build root package + all workspace packages
            build_package "."
            for pkg_dir in packages/*/; do
              build_package "$pkg_dir"
            done
          fi

          echo "Built artifacts:"
          ls -lh dist/

      - name: Build summary
        run: |
          {
            echo "## Built packages (not published)"
            echo '```'
            ls -1 dist/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
