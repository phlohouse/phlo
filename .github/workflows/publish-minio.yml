name: Publish MinIO Image
run-name: publish MinIO from ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      producer_run:
        description: Successful original MinIO publisher run to sign without rebuilding. Leave blank to build.
        type: string
        default: ""
      expected_digest:
        description: Exact sha256 digest from that producer. Required with producer_run.
        type: string
        default: ""

permissions: {}

concurrency:
  group: publish-minio
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'phlohouse/phlo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Validate signing-only inputs
        env:
          PRODUCER_RUN: ${{ inputs.producer_run }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
        run: |
          set -euo pipefail
          if [[ -n "$PRODUCER_RUN" || -n "$EXPECTED_DIGEST" ]]; then
            [[ "$PRODUCER_RUN" =~ ^[1-9][0-9]*$ ]]
            [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi
      - name: Authenticate the existing MinIO publisher and digest
        if: inputs.producer_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.producer_run }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
        run: >-
          python3 scripts/release_provenance.py collect-minio
          --producer-run "$PRODUCER_RUN" --expected-digest "$EXPECTED_DIGEST"
          --output generated-service-images.json
      - name: Upload authenticated existing digest
        if: inputs.producer_run != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: generated-service-images
          path: generated-service-images.json
          if-no-files-found: error
      - name: Prepare the independently versioned MinIO image
        if: inputs.producer_run == ''
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          image="$(jq -er '.release_set.services[] | select(.name == "minio") | .image_reference' registry/support/v1.json)"
          [[ "$image" =~ ^ghcr.io/phlohouse/phlo-minio:[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/generated-service-project/minio"
          cp packages/phlo-minio/src/phlo_minio/Dockerfile "$RUNNER_TEMP/generated-service-project/minio/"
          targets="$(jq -cn --arg image "$image" '[{
            service: "minio", services: ["minio", "minio-setup"], image: $image,
            root: "generated", context: "minio", dockerfile: "minio/Dockerfile", build_args: {}
          }]')"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
      - name: Upload MinIO build context
        if: inputs.producer_run == ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: generated-service-build-contexts
          path: ${{ runner.temp }}/generated-service-project
          if-no-files-found: error

  images:
    if: inputs.producer_run == ''
    needs: prepare
    uses: ./.github/workflows/build-service-images.yml
    permissions:
      contents: read
      packages: write
    with:
      candidate_sha: ${{ github.sha }}
      targets: ${{ needs.prepare.outputs.targets }}
      immutable_tags: true

  sign:
    needs: [prepare, images]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.images.result == 'success' ||
       (inputs.producer_run != '' && needs.images.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: generated-service-images
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22
        with:
          cosign-release: v3.0.5
      - name: Sign and verify the independently published immutable MinIO digest
        run: |
          set -euo pipefail
          jq -ce '.[]' generated-service-images.json > targets.jsonl
          while read -r target; do
            image="$(jq -r .image <<< "$target")"
            digest="$(jq -r .digest <<< "$target")"
            [[ "$image" =~ ^ghcr.io/phlohouse/phlo-minio:[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            actual="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | jq -er .)"
            [[ "$actual" == "$digest" ]]
            subject="${image%:*}@$digest"
            cosign sign --yes "$subject"
            cosign verify --certificate-identity \
              'https://github.com/phlohouse/phlo/.github/workflows/publish-minio.yml@refs/heads/main' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$subject" > minio-signatures.json
          done < targets.jsonl
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: minio-signature-verification
          path: minio-signatures.json
          if-no-files-found: error
