name: Release Promotion

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact staged release commit SHA
        required: true
        type: string
      stage_run:
        description: Successful immutable release-stage run ID, attempt 1
        required: true
        type: string
      execute:
        description: Publish staged bytes from this manual dispatch. Default publishes nothing.
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-promotion
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'phlohouse/phlo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Authenticate stage and every candidate acceptance attempt
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE_RUN: ${{ inputs.stage_run }}
        run: >-
          python3 scripts/release_provenance.py collect --candidate-sha "$CANDIDATE_SHA"
          --stage-run "$STAGE_RUN" --output inputs --evidence inputs/evidence
      - name: Apply unchanged repeated-run gate and plan publication
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: >-
          python3 scripts/promote_release_candidate.py promote
          --candidate-bom "inputs/candidate-$CANDIDATE_SHA/bom.json"
          --staging-dir "inputs/candidate-$CANDIDATE_SHA"
          --staged-utc "$(jq -r .staged_utc "inputs/candidate-$CANDIDATE_SHA/provenance.json")"
          --evidence inputs/evidence --receipt-output dry-run-receipt.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dry-run-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: dry-run-receipt.json
          if-no-files-found: error

  promote:
    if: inputs.execute
    needs: gate
    environment: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22
        with:
          cosign-release: v3.0.5
      - name: Reauthenticate all attempts and authorize the manual dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGE_RUN: ${{ inputs.stage_run }}
        run: |
          set -euo pipefail
          python3 scripts/release_provenance.py collect --candidate-sha "$CANDIDATE_SHA" \
            --stage-run "$STAGE_RUN" --output inputs --evidence inputs/evidence
          python3 scripts/release_provenance.py authorize \
            --bom "inputs/candidate-$CANDIDATE_SHA/bom.json" \
            --evidence inputs/evidence --output authorization.json
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish only the authorized staged bytes, never rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          archive="qualification-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          tar -czf "$archive" authorization.json inputs/evidence \
            "inputs/candidate-$CANDIDATE_SHA/bom.json" "inputs/candidate-$CANDIDATE_SHA/provenance.json"
          python3 scripts/promote_release_candidate.py promote \
            --candidate-bom "inputs/candidate-$CANDIDATE_SHA/bom.json" \
            --staging-dir "inputs/candidate-$CANDIDATE_SHA" --evidence inputs/evidence \
            --staged-utc "$(jq -r .staged_utc "inputs/candidate-$CANDIDATE_SHA/provenance.json")" \
            --authorization authorization.json --qualification-archive "$archive" \
            --execute --receipt-output promotion-receipt.json
      - name: Archive the matched final promotion receipt on the release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          jq -e '.status == "promoted" and .success == true' promotion-receipt.json > /dev/null
          version="$(jq -er '.artifacts[] | select(.kind == "source") | .version' "inputs/candidate-$CANDIDATE_SHA/bom.json")"
          archive="release-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          tar -czf "$archive" promotion-receipt.json
          gh release upload "v$version" "$archive"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: promotion-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            promotion-receipt.json
            authorization.json
            qualification-evidence-*.tar.gz
            release-evidence-*.tar.gz
          if-no-files-found: error
