name: Main source health

on:
  workflow_dispatch:
  push:
    branches: [main, beta]

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  reuse:
    name: main / verify queue evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reused: ${{ steps.decision.outputs.reused }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
      - name: Authenticate exact-SHA full queue evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project --with pyyaml==6.0.3 python scripts/ci_evidence.py reuse
          --output reuse-decision.json
      - name: Keep evidence reuse in shadow mode until rollout is enabled
        id: decision
        env:
          VALIDATED: ${{ steps.evidence.outputs.reused }}
          ENABLED: ${{ vars.CI_REUSE_QUEUE_EVIDENCE }}
        run: |
          reused=false
          if [ "$ENABLED" = true ] && [ "$VALIDATED" = true ]; then reused=true; fi
          echo "reused=$reused" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: reuse-decision-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reuse-decision.json
          if-no-files-found: error

  full:
    needs: reuse
    if: always() && needs.reuse.outputs.reused != 'true'
    uses: ./.github/workflows/pr.yml

  status:
    # Keep the existing source-health check identity. This is not artifact readiness.
    name: release candidate / status
    if: always()
    needs: [reuse, full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require reused full evidence or a complete full fallback
        env:
          REUSED: ${{ needs.reuse.outputs.reused }}
          REUSE: ${{ needs.reuse.result }}
          FULL: ${{ needs.full.result }}
        run: |
          set -euo pipefail
          if [ "$REUSED" = true ]; then
            test "$REUSE" = success
            test "$FULL" = skipped
          else
            test "$FULL" = success
          fi
          echo 'Source validation complete. Artifact qualification is a separate release decision.' >> "$GITHUB_STEP_SUMMARY"
