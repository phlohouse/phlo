name: Release

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish or recover, for example `v0.7.9`
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-pr:
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') &&
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !startsWith(github.event.head_commit.message, 'chore:') &&
      !startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'ci:') &&
      !startsWith(github.event.head_commit.message, 'build:') &&
      !startsWith(github.event.head_commit.message, 'style:') &&
      !startsWith(github.event.head_commit.message, 'test:')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
          enable-cache: false

      - uses: iamgp/ReleaseX@5dc88dc73d728dd1560444baadf66d6115c1bec2
        with:
          command: release pr
          version: v1.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  release-tag:
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') &&
      startsWith(github.event.head_commit.message, 'chore(release): phlo ')
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release-tag-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Require successful release-candidate evidence for this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            conclusion="$(gh api \
              --paginate \
              "/repos/${REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name == "release candidate / status" and .app.slug == "github-actions") | .conclusion' \
              | tail -n 1)"
            case "$conclusion" in
              success)
                echo "Release-candidate evidence is successful for ${CANDIDATE_SHA}."
                exit 0
                ;;
              failure|cancelled|skipped|timed_out|action_required)
                echo "::error::Release-candidate evidence for ${CANDIDATE_SHA} concluded: ${conclusion}"
                exit 1
                ;;
              *)
                echo "Waiting for release-candidate evidence for ${CANDIDATE_SHA} (currently: ${conclusion:-missing})"
                sleep 30
                ;;
            esac
          done
          echo "::error::Timed out waiting for release-candidate evidence for ${CANDIDATE_SHA}"
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Prove the ReleaseX candidate and proposed tag identity
        id: release-identity
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          root_version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          tag="v${root_version}"
          python scripts/release_identity.py source --tag "$tag"
          expected_head="relx/release/monorepo/${RELEASE_BRANCH}-release-set"
          prs="$(gh api --paginate "/repos/${REPOSITORY}/commits/${CANDIDATE_SHA}/pulls?per_page=100")"
          matching="$(jq --arg sha "$CANDIDATE_SHA" --arg base "$RELEASE_BRANCH" --arg head "$expected_head" --arg title "chore(release): phlo ${root_version}" '
            [ .[] | select(
              .state == "closed" and .merged_at != null and .merge_commit_sha == $sha and
              .base.ref == $base and .base.repo.full_name == .head.repo.full_name and
              .head.ref == $head and (.title | startswith($title)) and
              ([.labels[].name] | index("autorelease: pending"))
            ) ] | length
          ' <<<"$prs")"
          if [ "$matching" != 1 ]; then
            echo "::error::${CANDIDATE_SHA} is not exactly one merged ReleaseX release PR for ${RELEASE_BRANCH}"
            exit 1
          fi
          if gh api "/repos/${REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Ref refs/tags/${tag} already exists; refusing to create or reuse it during tag creation"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
          enable-cache: false

      - uses: iamgp/ReleaseX@5dc88dc73d728dd1560444baadf66d6115c1bec2
        with:
          command: release tag
          version: v1.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Verify created tag and GitHub Release target the candidate
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release-identity.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          target="$(git rev-parse "${TAG}^{commit}")"
          test "$target" = "$CANDIDATE_SHA"
          gh api "/repos/${REPOSITORY}/releases/tags/${TAG}" >/dev/null

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    concurrency:
      group: pypi-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
    steps:
      - name: Resolve publish ref
        id: publish-ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUBLISH_GITHUB_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag_input="$INPUT_TAG"
            case "$tag_input" in
              v*) ;;
              *) tag_input="v$tag_input" ;;
            esac
            ref="refs/tags/$tag_input"
          else
            ref="$PUBLISH_GITHUB_REF"
          fi

          case "$ref" in
            refs/tags/v*) ;;
            *)
              echo "::error::Publish ref must be a version tag like refs/tags/v0.7.9"
              exit 1
              ;;
          esac

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag=${ref#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.publish-ref.outputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Require successful release-candidate evidence for tag target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          conclusion="$(gh api \
            --paginate \
            "/repos/${REPOSITORY}/commits/${candidate_sha}/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name == "release candidate / status" and .app.slug == "github-actions") | .conclusion' \
            | tail -n 1)"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Tag target ${candidate_sha} has no successful release-candidate evidence (got: ${conclusion:-missing})"
            exit 1
          fi

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Build packages
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          repo_root="$PWD"
          rm -rf dist
          uv build --out-dir "$repo_root/dist"
          for pkg in packages/*/; do
            package_dist="$repo_root/${pkg%/}/dist"
            rm -rf "$package_dist"
            uv build --directory "$pkg" --out-dir "$package_dist"
          done

      - name: Validate the complete built artifact manifest
        env:
          TAG: ${{ steps.publish-ref.outputs.tag }}
        run: |
          mapfile -d '' artifacts < <(
            find dist packages -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print0
          )
          args=()
          for artifact in "${artifacts[@]}"; do args+=(--artifact "$artifact"); done
          python scripts/release_identity.py artifacts --tag "$TAG" "${args[@]}" --output release-manifest.json

      - name: Publish missing coherent artifacts
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python scripts/release_identity.py publish-plan --manifest release-manifest.json --output publish-plan.json
          mapfile -t artifacts < <(jq -r '.upload[].path' publish-plan.json)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "All expected artifacts are already published with matching hashes."
          else
            uv publish "${artifacts[@]}" --token "$PYPI_API_TOKEN"
          fi
          python scripts/release_identity.py publish-plan --manifest release-manifest.json --output publish-plan.json
          test "$(jq '.upload | length' publish-plan.json)" = 0
