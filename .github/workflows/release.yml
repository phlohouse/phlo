name: Release PR

on:
  push:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  release-pr:
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !startsWith(github.event.head_commit.message, 'chore:') &&
      !startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'ci:') &&
      !startsWith(github.event.head_commit.message, 'build:') &&
      !startsWith(github.event.head_commit.message, 'style:') &&
      !startsWith(github.event.head_commit.message, 'test:')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
          enable-cache: false
      # ReleaseX transformers run with a fixed PATH, not setup-uv's PATH.
      - name: Expose uv to release transformers
        run: sudo ln -sf "$(command -v uv)" /usr/local/bin/uv
      # Installs relx for the lockstep step and logs the per-package plan.
      - uses: iamgp/ReleaseX@5dc88dc73d728dd1560444baadf66d6115c1bec2
        if: github.ref_name == 'main'
        with:
          command: release plan
          version: v1.5.0
      # ADR 0053 decision 4: empty below 1.0.0, so packages keep independent versions.
      - name: Resolve lockstep release version
        id: lockstep
        if: github.ref_name == 'main'
        run: python3 scripts/release_lockstep_version.py >> "$GITHUB_OUTPUT"
      - uses: iamgp/ReleaseX@5dc88dc73d728dd1560444baadf66d6115c1bec2
        with:
          command: release pr
          version: v1.5.0
          next-version: ${{ steps.lockstep.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
