name: Release

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish or recover, for example `v0.7.9`
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-pr:
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') &&
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !startsWith(github.event.head_commit.message, 'chore:') &&
      !startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'ci:') &&
      !startsWith(github.event.head_commit.message, 'build:') &&
      !startsWith(github.event.head_commit.message, 'style:') &&
      !startsWith(github.event.head_commit.message, 'test:')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
          enable-cache: false

      - uses: iamgp/ReleaseX@a223ae18bee5d41335c20803bd397248fa15f05d
        with:
          command: release pr
          version: v1.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  release-tag:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Require successful release-candidate evidence for this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            conclusion="$(gh api \
              --paginate \
              "/repos/${REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name == "release candidate / status") | .conclusion' \
              | tail -n 1)"
            case "$conclusion" in
              success)
                echo "Release-candidate evidence is successful for ${CANDIDATE_SHA}."
                exit 0
                ;;
              failure|cancelled|skipped|timed_out|action_required)
                echo "::error::Release-candidate evidence for ${CANDIDATE_SHA} concluded: ${conclusion}"
                exit 1
                ;;
              *)
                echo "Waiting for release-candidate evidence for ${CANDIDATE_SHA} (currently: ${conclusion:-missing})"
                sleep 30
                ;;
            esac
          done
          echo "::error::Timed out waiting for release-candidate evidence for ${CANDIDATE_SHA}"
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
          enable-cache: false

      - uses: iamgp/ReleaseX@a223ae18bee5d41335c20803bd397248fa15f05d
        with:
          command: release tag
          version: v1.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    concurrency:
      group: pypi-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
    steps:
      - name: Resolve publish ref
        id: publish-ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUBLISH_GITHUB_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag_input="$INPUT_TAG"
            case "$tag_input" in
              v*) ;;
              *) tag_input="v$tag_input" ;;
            esac
            ref="refs/tags/$tag_input"
          else
            ref="$PUBLISH_GITHUB_REF"
          fi

          case "$ref" in
            refs/tags/v*) ;;
            *)
              echo "::error::Publish ref must be a version tag like refs/tags/v0.7.9"
              exit 1
              ;;
          esac

          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.publish-ref.outputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Require successful release-candidate evidence for tag target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          conclusion="$(gh api \
            --paginate \
            "/repos/${REPOSITORY}/commits/${candidate_sha}/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name == "release candidate / status") | .conclusion' \
            | tail -n 1)"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Tag target ${candidate_sha} has no successful release-candidate evidence (got: ${conclusion:-missing})"
            exit 1
          fi

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Build packages
        run: |
          repo_root="$PWD"
          rm -rf dist
          uv build --out-dir "$repo_root/dist"
          for pkg in packages/*/; do
            package_dist="$repo_root/${pkg%/}/dist"
            rm -rf "$package_dist"
            uv build --directory "$pkg" --out-dir "$package_dist"
          done

      - name: Remove already-published artifacts
        run: |
          python <<'PY'
          from __future__ import annotations

          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          def canonical_name(name: str) -> str:
              return re.sub(r"[-_.]+", "-", name).lower()

          def project_name(filename: str) -> str:
              if filename.endswith(".whl"):
                  return filename.split("-", 2)[0]
              for suffix in (".tar.gz", ".zip"):
                  if filename.endswith(suffix):
                      return filename[: -len(suffix)].rsplit("-", 1)[0]
              raise ValueError(f"Unsupported artifact filename: {filename}")

          artifacts = sorted(
              [
                  *Path("dist").glob("*"),
                  *Path("packages").glob("*/dist/*"),
              ]
          )
          cache: dict[str, str] = {}
          for artifact in artifacts:
              if not artifact.is_file() or not artifact.name.endswith((".whl", ".tar.gz", ".zip")):
                  continue
              package = canonical_name(project_name(artifact.name))
              if package not in cache:
                  try:
                      with urllib.request.urlopen(
                          f"https://pypi.org/simple/{package}/", timeout=30
                      ) as response:
                          cache[package] = response.read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404:
                          cache[package] = ""
                      else:
                          raise
              if artifact.name in cache[package]:
                  artifact.unlink()
                  print(f"Skipping existing PyPI artifact: {artifact}")
              else:
                  print(f"Will publish: {artifact}")
          PY

      - name: Publish packages
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          mapfile -d '' artifacts < <(
            find dist packages -type f \( -path 'dist/*' -o -path 'packages/*/dist/*' \) \( -name '*.whl' -o -name '*.tar.gz' \) -print0
          )
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No unpublished artifacts to publish."
            exit 0
          fi
          uv publish "${artifacts[@]}" --token "$PYPI_API_TOKEN"
