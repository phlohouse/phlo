name: Release on merge

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  coordinate:
    if: github.repository == 'phlohouse/phlo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Coordinate authenticated release workflows
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: python3 scripts/release_merge.py
