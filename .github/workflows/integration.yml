name: Integration Lane

on:
  workflow_dispatch:
  workflow_call:
    # Retained for existing release callers; disposable tests do not use secrets.
    secrets:
      POSTGRES_PASSWORD:
        required: false
      MINIO_ROOT_PASSWORD:
        required: false
      SUPERSET_ADMIN_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  integration:
    name: integration / required suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-workspace
      - name: Run named behavioral contracts
        run: uv run --locked python scripts/run_integration.py
      - name: Upload required suite results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: integration-results
          path: test-results/integration/
          if-no-files-found: error
