name: Build Staged Service Images

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      distributions_artifact:
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    if: github.repository == 'phlohouse/phlo' && github.ref == 'refs/heads/main'
    name: Prepare generated build contexts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
      has_targets: ${{ steps.matrix.outputs.has_targets }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select protected candidate data
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          # Keep workflow scripts at the trusted workflow commit.
          mkdir -p "$RUNNER_TEMP/trusted-scripts"
          cp scripts/generated_image_matrix.py "$RUNNER_TEMP/trusted-scripts/"
          git checkout --detach "$CANDIDATE_SHA"

      - name: Download build-once candidate distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ inputs.distributions_artifact }}
          path: ${{ runner.temp }}/candidate-distributions

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Install workspace service plugins
        run: |
          uv python install 3.12
          uv sync --python 3.12 --all-packages --locked

      - name: Render every installed service through the public CLI
        id: matrix
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/generated-service-project"
          mkdir -p "$project"
          cd "$project"
          uv --project "$GITHUB_WORKSPACE" run --locked phlo services init --no-dev --force
          mapfile -t services < <(
            uv --project "$GITHUB_WORKSPACE" run --locked phlo services list --all --json |
              jq -r '.data[].name'
          )
          add_args=()
          for service in "${services[@]}"; do
            add_args+=(--service "$service")
          done
          uv --project "$GITHUB_WORKSPACE" run --locked phlo services add "${add_args[@]}" --no-start
          # Generated service images must embed the workspace packages from
          # this revision. Otherwise the runtime Dockerfiles resolve PyPI.
          wheelhouse="$project/.phlo/wheelhouse"
          mkdir -p "$wheelhouse"
          cp "$RUNNER_TEMP"/candidate-distributions/*.whl "$wheelhouse/"
          phlo_version="$(
            uv --project "$GITHUB_WORKSPACE" run --locked python \
              -c 'from importlib.metadata import version; print(version("phlo"))'
          )"
          dagster_version="$(
            uv --project "$GITHUB_WORKSPACE" run --locked python \
              -c 'from importlib.metadata import version; print(version("phlo-dagster"))'
          )"
          {
            echo "PHLO_VERSION=$phlo_version"
            echo "PHLO_DAGSTER_VERSION=$dagster_version"
            echo "PHLO_WHEELHOUSE=wheelhouse"
          } >> "$project/.phlo/.env.local"
          docker compose \
            --profile '*' \
            -f "$project/.phlo/docker-compose.yml" \
            --project-directory "$project/.phlo" \
            --env-file "$project/.phlo/.env.local" \
            config --format json > "$RUNNER_TEMP/generated-compose.json"
          matrix="$(
            uv --project "$GITHUB_WORKSPACE" run --locked python \
              "$RUNNER_TEMP/trusted-scripts/generated_image_matrix.py" \
              "$RUNNER_TEMP/generated-compose.json" \
              "$project" \
              "$GITHUB_WORKSPACE"
          )"
          # MinIO is an independently published dependency, not a staged build.
          matrix="$(jq '.include |= map(select(.services | index("minio") | not))' <<< "$matrix")"
          # Staging can never mutate a release repository/tag.
          matrix="$(jq --arg sha "$CANDIDATE_SHA" '.include |= map(.image = ((.image | split("@")[0] | split(":")[0]) + "-development:" + $sha))' <<< "$matrix")"
          echo "targets=$(jq -c '.include' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo 'has_targets=true' >> "$GITHUB_OUTPUT"

      - name: Upload generated build contexts
        if: steps.matrix.outputs.has_targets == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: generated-service-build-contexts
          path: ${{ runner.temp }}/generated-service-project
          include-hidden-files: true
          if-no-files-found: error

  images:
    needs: prepare
    if: needs.prepare.outputs.has_targets == 'true'
    uses: ./.github/workflows/build-service-images.yml
    permissions:
      contents: read
      packages: write
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      targets: ${{ needs.prepare.outputs.targets }}
