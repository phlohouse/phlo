name: Nightly

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      POSTGRES_PASSWORD:
        required: true
      MINIO_ROOT_PASSWORD:
        required: true
      SUPERSET_ADMIN_PASSWORD:
        required: true
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  upstream-compatibility:
    name: nightly / fresh provider dependencies
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
      - name: Probe fresh dependency resolution from installed wheels
        run: >-
          python3 scripts/verify_installed_provider_artifacts.py
          --output "$RUNNER_TEMP/upstream-compatibility.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: upstream-compatibility
          path: ${{ runner.temp }}/upstream-compatibility.json
          if-no-files-found: error

  full-integration:
    name: nightly / full integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run full integration suite
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          SUPERSET_ADMIN_PASSWORD: ${{ secrets.SUPERSET_ADMIN_PASSWORD }}
        run: uv run --locked pytest -m integration --tb=short tests packages/*/tests

  release-golden-path:
    name: python / release golden path
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"

      - name: Run release artifact golden path
        run: python3 scripts/release_golden_path.py

  release-artifact-acceptance:
    name: python / release artifact acceptance (${{ matrix.host.label }})
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Two runner classes give the same staged candidate bundles from two
        # distinct hosts (per-VM hostnames) and architectures; distinct UTC
        # days come from the cron cadence.
        host:
          - label: amd64
            runner: ubuntu-latest
          - label: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"

      # The nightly only performs non-promoting artifact acceptance:
      # it only ever consumes one staged, immutable candidate BOM and never
      # stages, rebuilds, promotes, or authorizes anything. Candidate staging
      # publication is owned by the release automation, which
      # attaches bom.json plus every staged distribution to the candidate's
      # draft GitHub release.
      - name: Locate the staged candidate BOM
        id: bom
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="candidate-${GITHUB_SHA}"
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" --json assets \
              -q '.assets[].name' 2>/dev/null | grep -qx 'bom.json'; then
            gh release download "$release" --repo "$GITHUB_REPOSITORY" \
              --pattern '*' --dir "$RUNNER_TEMP/candidate"
            mkdir -p "$RUNNER_TEMP/candidate/distributions"
            find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f ! -name 'bom.json' \
              -exec mv {} "$RUNNER_TEMP/candidate/distributions/" \;
            echo "bom=$RUNNER_TEMP/candidate/bom.json" >> "$GITHUB_OUTPUT"
          else
            echo "bom=" >> "$GITHUB_OUTPUT"
            echo "::notice::No candidate BOM is staged for ${GITHUB_SHA}; the nightly records a skipped artifact-acceptance run."
          fi

      - name: Run the artifact-bound golden path
        if: steps.bom.outputs.bom != ''
        env:
          BOM: ${{ steps.bom.outputs.bom }}
        run: |
          python3 scripts/release_golden_path.py \
            --candidate-bom "$BOM" \
            --evidence-output "$RUNNER_TEMP/release-candidate-evidence.json"

      - name: Validate the evidence bundle
        if: steps.bom.outputs.bom != ''
        env:
          BOM: ${{ steps.bom.outputs.bom }}
        run: |
          python3 scripts/validate_release_evidence.py \
            --bundle "$RUNNER_TEMP/release-candidate-evidence.json" \
            --candidate-bom "$BOM"

      - name: Upload evidence bundle
        if: steps.bom.outputs.bom != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-candidate-evidence-${{ github.sha }}-${{ matrix.host.label }}
          path: ${{ runner.temp }}/release-candidate-evidence.json
          if-no-files-found: error

  operations-evidence:
    name: python / security + maintenance evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install the complete service workspace
        run: |
          uv python install 3.11
          uv sync --python 3.11 --all-packages --locked

      - name: Run live authz sync/verify + journaled maintenance
        run: |
          uv run --locked python scripts/nightly_evidence.py \
            --output "$RUNNER_TEMP/operations-evidence"

      - name: Upload operations evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: operations-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/operations-evidence/
          if-no-files-found: warn
          include-hidden-files: true

  nightly-status:
    name: nightly / status
    if: always()
    needs:
      - full-integration
      - release-golden-path
      - release-artifact-acceptance
      - operations-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Require every nightly check to succeed
        env:
          FULL_INTEGRATION: ${{ needs.full-integration.result }}
          RELEASE_GOLDEN_PATH: ${{ needs.release-golden-path.result }}
          RELEASE_ARTIFACT_ACCEPTANCE: ${{ needs.release-artifact-acceptance.result }}
          OPERATIONS_EVIDENCE: ${{ needs.operations-evidence.result }}
        run: |
          set -euo pipefail
          for result in "$FULL_INTEGRATION" "$RELEASE_GOLDEN_PATH" "$OPERATIONS_EVIDENCE"; do
            if [ "$result" != "success" ]; then
              echo "::error::Required nightly check finished with result: $result"
              exit 1
            fi
          done
          # The artifact-acceptance caller is skipped only when no candidate
          # BOM is staged for this commit; a run that starts must succeed.
          if [ "$RELEASE_ARTIFACT_ACCEPTANCE" != "success" ] \
            && [ "$RELEASE_ARTIFACT_ACCEPTANCE" != "skipped" ]; then
            echo "::error::Required nightly check finished with result: $RELEASE_ARTIFACT_ACCEPTANCE"
            exit 1
          fi
