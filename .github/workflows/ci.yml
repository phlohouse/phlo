name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      selection:
        description: JSON selection from the PR change detector; empty means full CI
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ci-config:
    name: ci / prepare selection and wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
      python: ${{ steps.groups.outputs.python }}
      frontend: ${{ steps.groups.outputs.frontend }}
      writer: ${{ steps.groups.outputs.writer }}
      plugin: ${{ steps.groups.outputs.plugin }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"

      - name: Validate workflow YAML
        run: ruby -e 'Dir[".github/workflows/*.yml"].each { |file| YAML.load_file(file) }' -r yaml

      - name: Check package test groups
        run: python3 scripts/check_ci_package_groups.py

      - name: Require workflow job deadlines
        run: python3 scripts/check_workflow_timeouts.py

      - name: Select package matrix
        id: groups
        env:
          SELECTION: ${{ inputs.selection }}
        run: |
          if [ -z "$SELECTION" ]; then
            SELECTION="$(python3 scripts/select_ci.py --base HEAD --head HEAD)"
          fi
          for key in groups python frontend writer plugin; do
            echo "$key=$(jq -c ".$key" <<< "$SELECTION")" >> "$GITHUB_OUTPUT"
          done

      - name: Validate v1 support boundary
        run: python3 scripts/validate_support_manifest.py

      - name: Lint workflows with actionlint
        run: make actionlint

      - name: Build wheels and export locked external constraints once
        if: steps.groups.outputs.python == 'true'
        run: |
          uv build --all-packages --wheel --out-dir provider-wheelhouse
          uv export --all-packages --no-dev --locked --no-emit-workspace --no-hashes \
            --output-file provider-wheelhouse/constraints.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: steps.groups.outputs.python == 'true'
        with:
          name: provider-wheelhouse
          path: provider-wheelhouse/
          if-no-files-found: error

  installed-provider-artifacts:
    name: python / installed provider artifacts (${{ matrix.docker-shard }})
    needs: ci-config
    if: needs.ci-config.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        docker-shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker-mirror

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: provider-wheelhouse
          path: provider-wheelhouse

      - name: Verify installed provider artifacts
        id: installed_provider_artifacts
        shell: bash
        run: |
          mkdir -p provider-artifacts
          python3 scripts/verify_installed_provider_artifacts.py \
            --wheelhouse provider-wheelhouse \
            --constraints provider-wheelhouse/constraints.txt \
            --include-docker-builds \
            --include-docker-health \
            --docker-shard-index ${{ matrix.docker-shard }} \
            --docker-shard-count 4 \
            --output provider-artifacts/installed-provider-artifacts.json

      - name: Scan locally built first-party images without publishing
        shell: bash
        run: |
          set -euo pipefail
          jq -r '. as $report | [.images[] |
            select(.build and (.image | startswith("ghcr.io/phlohouse/phlo-"))) |
            select(.service as $service | any($report.builds[]; .service == $service and .status == "passed")) |
            .image] | unique[]' provider-artifacts/installed-provider-artifacts.json > provider-artifacts/local-images.txt
          while IFS= read -r image; do
            digest="$(docker image inspect --format '{{.Id}}' "$image")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            report="provider-artifacts/security-${digest#sha256:}.json"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/provider-artifacts:/work" mirror.gcr.io/aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
              image --image-src docker --format json --output "/work/${report##*/}" --scanners vuln "$digest"
            jq -e --arg digest "$digest" '.SchemaVersion == 2 and .ArtifactType == "container_image" and .Metadata.ImageID == $digest' "$report" > /dev/null
            uv run --no-project --with pyyaml==6.0.3 python scripts/container_security.py \
              apply-policy --image "$image" --report "$report"
          done < provider-artifacts/local-images.txt

      - name: Upload installed provider artifact evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: installed-provider-artifacts-${{ matrix.docker-shard }}
          path: provider-artifacts/
          if-no-files-found: warn

  python-quality:
    name: quality / source and file contracts
    needs: ci-config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
      - name: Install Python workspace
        if: needs.ci-config.outputs.python == 'true'
        run: |
          uv python install 3.12
          uv sync --python 3.12 --dev --locked

      - name: Check private-key hook with a non-allow-listed fixture
        run: |
          fixture=ci-private-key-sentinel.pem
          trap 'rm -f "$fixture"' EXIT
          printf '%s%s\n' '-----BEGIN ' 'RSA PRIVATE KEY-----' > "$fixture"
          printf '%s\n' fixture >> "$fixture"
          printf '%s%s\n' '-----END ' 'RSA PRIVATE KEY-----' >> "$fixture"
          if uvx --from prek==0.5.3 prek run detect-private-key --files "$fixture"; then
            echo '::error::Private-key hook did not reject the fixture'
            exit 1
          fi
      - name: Run remaining file hooks
        env:
          SKIP: ruff,ruff-complexity,ruff-format,generated-reference-docs,prettier-observatory,zizmor,sqlfluff-dbt
        run: uvx --from prek==0.5.3 prek run --all-files
      - name: Audit workflow hardening
        run: make zizmor

      - name: Validate fresh release package versions
        if: needs.ci-config.outputs.python == 'true'
        run: |
          baseline="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^)"
          uv run --locked python scripts/release_identity.py candidate --base-ref "$baseline"

      - name: Lint with ruff
        if: needs.ci-config.outputs.python == 'true'
        run: |
          uv run --locked ruff check .
          uv run --locked ruff check --config pyproject.toml --select C901 .

      - name: Check Python formatting
        if: needs.ci-config.outputs.python == 'true'
        run: uv run --locked ruff format --check .

      - name: Check generated reference documentation
        if: needs.ci-config.outputs.python == 'true'
        run: make docs-reference-check

      - name: Type check with ty
        if: needs.ci-config.outputs.python == 'true'
        run: make typecheck-python

      - name: Lint SQL with sqlfluff
        if: needs.ci-config.outputs.python == 'true'
        run: |
          set -euo pipefail
          if [ -d "workflows/transforms/dbt" ]; then
            uv run --locked sqlfluff lint workflows/transforms/dbt
          else
            echo "Skipping sqlfluff: no workflows/transforms/dbt directory."
          fi

  python-core-tests:
    name: python / core tests (${{ matrix.python-version }}, shard ${{ matrix.shard }})
    needs: ci-config
    if: needs.ci-config.outputs.python == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      COVERAGE_FILE: test-results/.coverage.core-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/python-workspace
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run core regression suite
        if: matrix.shard == 0
        id: core_regression
        env:
          CORE_REGRESSION_PYTEST_ARGS: --tb=short --ignore=tests/cli/test_quickstart_smoke.py --junitxml=test-results/core-regression.xml --cov=phlo --cov-report=
        run: make test-core-regression

      - name: Run core tests
        id: core_tests
        run: >-
          uv run --locked python -m pytest tests -m "not integration and not core_regression"
          -p scripts.ci_shard --ci-shard-index=${{ matrix.shard }} --ci-shard-count=3
          -o faulthandler_timeout=60 -o faulthandler_exit_on_timeout=true
          --tb=short --durations=25 --junitxml=test-results/core.xml
          --cov=phlo --cov=scripts --cov-append --cov-report=xml:test-results/coverage.xml

      - name: Upload core test timings and coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: core-tests-${{ matrix.python-version }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: error
          include-hidden-files: true

  python-package-tests:
    name: python / package tests (${{ matrix.group }}, ${{ matrix.python-version }})
    needs: ci-config
    if: needs.ci-config.outputs.groups != '[]'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-config.outputs.groups) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Run package test group
        env:
          PACKAGES: ${{ matrix.packages }}
        shell: bash
        run: |
          set -euo pipefail

          failed_count=0
          for package in ${PACKAGES}; do
            test_dir="packages/${package}/tests"
            if [ ! -d "${test_dir}" ]; then
              echo "::error::Package test directory missing: ${test_dir}"
              failed_count=$((failed_count + 1))
              continue
            fi

            echo "::group::${package}"
            set +e
            COVERAGE_FILE="test-results/.coverage.${package}" \
              uv run --python ${{ matrix.python-version }} --locked --package "${package}" --with-editable ./packages/phlo-testing --with pytest --with pytest-cov==7.1.0 \
              pytest -m "not integration" --tb=short "${test_dir}" --junitxml="test-results/${package}.xml" --cov="${package//-/_}" --cov-report=
            exit_code=$?
            set -e
            echo "::endgroup::"

            if [ "${exit_code}" -ne 0 ]; then
              echo "::error::${package} tests failed with exit ${exit_code}"
              failed_count=$((failed_count + 1))
            fi
          done

          if [ "${failed_count}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload package contract results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: package-results-${{ matrix.group }}-${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: error
          include-hidden-files: true

  python-coverage:
    name: python / measured coverage floors
    needs: ci-config
    if: needs.ci-config.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-workspace
      - name: Measure complete non-integration workspace and enforce floors
        run: make test-coverage
      - name: Publish per-source line/branch totals and skip reasons
        if: always()
        run: |
          python3 scripts/test_summary.py test-results/coverage >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/coverage_report.py test-results/coverage/coverage.json \
            --output test-results/coverage/totals.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: workspace-line-branch-coverage
          path: test-results/coverage/
          if-no-files-found: error
          include-hidden-files: true

  windows-portability:
    name: windows / compose portability
    needs: ci-config
    if: needs.ci-config.outputs.python == 'true'
    uses: ./.github/workflows/windows-compose-portability.yml
    with:
      reuse-wheelhouse: true

  frontend:
    name: behaviour / JavaScript
    needs: ci-config
    if: needs.ci-config.outputs.frontend == 'true' || needs.ci-config.outputs.writer == 'true' || needs.ci-config.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/phlo-observatory/src/phlo_observatory
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            packages/phlo-observatory/src/phlo_observatory/package-lock.json
            apps/phlo-github-writer/package-lock.json

      - name: Install dependencies
        if: needs.ci-config.outputs.frontend == 'true'
        id: observatory_install
        run: npm ci

      - name: Install authoritative API for the method/schema drift gate
        if: needs.ci-config.outputs.frontend == 'true'
        uses: ./.github/actions/python-workspace

      - name: Check formatting with Prettier
        if: ${{ !cancelled() && steps.observatory_install.outcome == 'success' }}
        run: npx prettier --check .

      - name: Lint with ESLint
        if: ${{ !cancelled() && steps.observatory_install.outcome == 'success' }}
        run: npm run lint -- --max-warnings 0

      - name: Type check with TypeScript
        if: ${{ !cancelled() && steps.observatory_install.outcome == 'success' }}
        run: npx tsc --noEmit

      - name: Check for unused files and dependencies with knip
        if: ${{ !cancelled() && steps.observatory_install.outcome == 'success' }}
        run: npm run knip

      - name: Build production bundle
        if: ${{ !cancelled() && steps.observatory_install.outcome == 'success' }}
        id: observatory_build
        run: npm run build

      - name: Run tests
        if: ${{ !cancelled() && steps.observatory_install.outcome == 'success' }}
        run: npm test

      - name: Install pinned browser driver and Chromium
        if: ${{ !cancelled() && steps.observatory_build.outcome == 'success' }}
        # Disposable CI-only driver, kept out of the product dependency graph.
        run: | # zizmor: ignore[adhoc-packages]
          npm install --global agent-browser@0.38.1
          agent-browser install --with-deps
      - name: Smoke the built Node app against the controlled authenticated API
        if: ${{ !cancelled() && steps.observatory_build.outcome == 'success' }}
        env:
          SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/test-results/browser
        run: node scripts/browser-smoke.mjs
      - name: Upload built browser smoke evidence
        if: always() && needs.ci-config.outputs.frontend == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: built-observatory-browser-smoke
          path: test-results/browser/
          if-no-files-found: error

      - name: Install writer dependencies
        if: ${{ !cancelled() && needs.ci-config.outputs.writer == 'true' }}
        id: writer_install
        working-directory: apps/phlo-github-writer
        run: npm ci

      - name: Type check writer
        if: ${{ !cancelled() && steps.writer_install.outcome == 'success' }}
        working-directory: apps/phlo-github-writer
        run: npm run typecheck

      - name: Run writer tests
        if: ${{ !cancelled() && steps.writer_install.outcome == 'success' }}
        working-directory: apps/phlo-github-writer
        run: npm test

      - name: Build writer
        if: ${{ !cancelled() && steps.writer_install.outcome == 'success' }}
        working-directory: apps/phlo-github-writer
        run: npm run build

      - name: Run plugin behavior tests
        if: ${{ !cancelled() && needs.ci-config.outputs.plugin == 'true' }}
        working-directory: .
        run: |
          mkdir -p test-results
          node --experimental-strip-types --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results/plugin.xml \
            .amp/plugins/phlo-github/lib.test.ts
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          report = ET.parse("test-results/plugin.xml")
          assert report.findall(".//testcase"), "Plugin suite must execute tests"
          assert not report.findall(".//skipped"), "Required plugin tests must not skip"
          PY
      - name: Upload plugin results
        if: always() && needs.ci-config.outputs.plugin == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: plugin-results
          path: test-results/plugin.xml
          if-no-files-found: error

  ci-status:
    name: ci / status
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    needs:
      - ci-config
      - installed-provider-artifacts
      - python-quality
      - python-core-tests
      - python-package-tests
      - python-coverage
      - windows-portability
      - frontend
    steps:
      - name: Summarize CI lane results
        shell: bash
        env:
          CI_CONFIG: ${{ needs.ci-config.result }}
          INSTALLED_PROVIDER_ARTIFACTS: ${{ needs.installed-provider-artifacts.result }}
          PYTHON_QUALITY: ${{ needs.python-quality.result }}
          PYTHON_CORE_TESTS: ${{ needs.python-core-tests.result }}
          PYTHON_PACKAGE_TESTS: ${{ needs.python-package-tests.result }}
          PYTHON_COVERAGE: ${{ needs.python-coverage.result }}
          WINDOWS_PORTABILITY: ${{ needs.windows-portability.result }}
          FRONTEND: ${{ needs.frontend.result }}
          SELECT_PYTHON: ${{ needs.ci-config.outputs.python }}
          SELECT_GROUPS: ${{ needs.ci-config.outputs.groups }}
          SELECT_FRONTEND: ${{ needs.ci-config.outputs.frontend }}
          SELECT_WRITER: ${{ needs.ci-config.outputs.writer }}
          SELECT_PLUGIN: ${{ needs.ci-config.outputs.plugin }}
        run: |
          set -euo pipefail

          {
            echo "### CI summary"
            echo ""
            echo "| Lane | Result |"
            echo "|---|---|"
            echo "| ci / config | ${CI_CONFIG} |"
            echo "| python / installed provider artifacts | ${INSTALLED_PROVIDER_ARTIFACTS} |"
            echo "| quality / source and file contracts | ${PYTHON_QUALITY} |"
            echo "| python / core tests | ${PYTHON_CORE_TESTS} |"
            echo "| integration / Windows contracts | ${WINDOWS_PORTABILITY} |"
            echo "| python / package tests | ${PYTHON_PACKAGE_TESTS} |"
            echo "| python / line and branch floors | ${PYTHON_COVERAGE} |"
            echo "| behaviour / JavaScript | ${FRONTEND} |"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$CI_CONFIG" = success
          test "$PYTHON_QUALITY" = success
          expected_python=skipped
          expected_groups=skipped
          expected_node=skipped
          if [ "$SELECT_PYTHON" = true ]; then expected_python=success; fi
          if [ "$SELECT_GROUPS" != '[]' ]; then expected_groups=success; fi
          if [ "$SELECT_FRONTEND" = true ] || [ "$SELECT_WRITER" = true ] || [ "$SELECT_PLUGIN" = true ]; then expected_node=success; fi
          for result in "$INSTALLED_PROVIDER_ARTIFACTS" "$PYTHON_CORE_TESTS" "$PYTHON_COVERAGE" "$WINDOWS_PORTABILITY"; do
            test "$result" = "$expected_python"
          done
          test "$PYTHON_PACKAGE_TESTS" = "$expected_groups"
          test "$FRONTEND" = "$expected_node"
