name: Release Build

# Build the release set once, pin it into a BOM, and run the artifact golden
# path against exactly those bytes. Release Rehearsal calls this on ReleaseX
# PRs, release-machinery PRs and nightly; Release calls it before publishing,
# so release day runs the same jobs that have been green all month.

on:
  workflow_call:
    inputs:
      sha:
        description: Commit to build. Empty builds the checked-out commit (a PR merge ref).
        type: string
        default: ""
      rehearsal:
        description: Pin under rehearsal-<sha> tags; the BOM can never be published.
        type: boolean
        default: true
      hosts:
        description: >-
          JSON list of golden-path hosts. PR rehearsals run amd64 only; nightly
          and Release run both. amd64 is always required.
        type: string
        default: '["amd64","arm64"]'
      upgrade_scope:
        description: >-
          How much of the Observatory journey the retained-volume upgrade repeats.
          PR rehearsals run "upgrade" (the upgrade-only checks; the fresh part
          proves the rest). Nightly and Release run "full".
        type: string
        default: full
    outputs:
      sha:
        description: The commit that was built.
        value: ${{ jobs.distributions.outputs.sha }}

permissions: {}

jobs:
  distributions:
    name: build / distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
      - name: Resolve the commit to build
        id: sha
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          REHEARSAL: ${{ inputs.rehearsal }}
          HOSTS: ${{ inputs.hosts }}
          UPGRADE_SCOPE: ${{ inputs.upgrade_scope }}
        run: |
          set -euo pipefail
          # Release always proves both hosts and the full upgrade journey; a
          # rehearsal may drop arm64 and shorten the upgrade journey only.
          jq -e 'type == "array" and index("amd64") != null and all(.[]; . == "amd64" or . == "arm64") and length == (unique | length)' <<< "$HOSTS"
          case "$UPGRADE_SCOPE" in full|upgrade) ;; *) echo "unknown upgrade scope"; exit 1 ;; esac
          if [ "$REHEARSAL" != true ]; then
            jq -e 'sort == ["amd64","arm64"]' <<< "$HOSTS"
            test "$UPGRADE_SCOPE" = full
          fi
          sha="${REQUESTED_SHA:-$(git rev-parse HEAD)}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$sha^{commit}"
          if [ "$REHEARSAL" != true ]; then
            test "$GITHUB_REF" = refs/heads/main
            git merge-base --is-ancestor "$sha" origin/main
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Build the release set once
        env:
          CANDIDATE_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$CANDIDATE_SHA")"
          export SOURCE_DATE_EPOCH
          mkdir -p "$RUNNER_TEMP/tree"
          git archive "$CANDIDATE_SHA" | tar -x -C "$RUNNER_TEMP/tree"
          uv build --directory "$RUNNER_TEMP/tree" --all-packages --out-dir "$RUNNER_TEMP/distributions"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: distributions-${{ steps.sha.outputs.sha }}
          path: ${{ runner.temp }}/distributions
          if-no-files-found: error
          retention-days: 30

  # Beside the image build rather than before it: the BOM is not pinned
  # until this passes, so nothing is lost by not waiting on it.
  published-extras:
    needs: distributions
    name: build / published extras resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      # The check resolves each extra with uv.
      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: distributions-${{ needs.distributions.outputs.sha }}
          path: ${{ runner.temp }}/distributions
      - name: Fail if any published extra cannot resolve from PyPI
        env:
          CANDIDATE_SHA: ${{ needs.distributions.outputs.sha }}
        run: |
          set -euo pipefail
          git show "$CANDIDATE_SHA:registry/support/v1.json" > "$RUNNER_TEMP/support-manifest.json"
          python3 scripts/check_published_extras.py \
            --manifest "$RUNNER_TEMP/support-manifest.json" \
            --distributions "$RUNNER_TEMP/distributions" \
            --python-version 3.12

  images:
    needs: distributions
    uses: ./.github/workflows/build-core-services.yml
    permissions:
      contents: read
      packages: write
    with:
      candidate_sha: ${{ needs.distributions.outputs.sha }}
      distributions_artifact: distributions-${{ needs.distributions.outputs.sha }}
      rehearsal: ${{ inputs.rehearsal }}

  pin:
    needs: [distributions, images, published-extras]
    name: build / pin BOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: distributions-${{ needs.distributions.outputs.sha }}
          path: distributions
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: generated-service-images
          path: images
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pin the image digests and distribution bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.distributions.outputs.sha }}
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          set -euo pipefail
          mode=()
          if [ "$REHEARSAL" = true ]; then mode=(--rehearsal); fi
          python3 scripts/release_stage.py pin "${mode[@]}" --candidate-sha "$CANDIDATE_SHA" \
            --images images/generated-service-images.json --distributions distributions --output candidate
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-set-${{ needs.distributions.outputs.sha }}
          path: candidate
          if-no-files-found: error
          retention-days: 30

  smoke:
    needs: [distributions, pin]
    name: build / golden path part (${{ matrix.host }}, ${{ matrix.part }})
    runs-on: ${{ matrix.host == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 25
    permissions:
      contents: read
    # arm64 reports but never blocks: its failures so far were runner tooling.
    continue-on-error: ${{ matrix.host == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.hosts) }}
        # Each part starts its own stack; together they are the whole golden path.
        part: [core, observatory-fresh, observatory-upgrade]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-set-${{ needs.distributions.outputs.sha }}
          path: candidate
      - name: Download the latest published release as the upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          mkdir -p previous/distributions
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir previous --pattern bom.json
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir previous/distributions \
            --pattern '*.whl' --pattern '*.tar.gz'
          rm -f previous/distributions/qualification-evidence-*.tar.gz previous/distributions/release-evidence-*.tar.gz
          echo "Upgrade baseline: $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned browser driver and Chromium
        if: matrix.part != 'core'
        # Disposable acceptance tooling, not a product dependency.
        run: | # zizmor: ignore[adhoc-packages]
          sudo apt-get update
          sudo apt-get install --yes libnss3-tools
          npm install --global agent-browser@0.38.1
          if [ "$(uname -m)" = "aarch64" ]; then
            npx --yes playwright@1.65.1 install --with-deps chromium
            chrome="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f -perm -u+x | head -n 1)"
            test -n "$chrome"
            echo "AGENT_BROWSER_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
          else
            agent-browser install --with-deps
          fi
      - name: Run this part of the artifact golden path against the built bytes
        env:
          PART: ${{ matrix.part }}
          UPGRADE_SCOPE: ${{ inputs.upgrade_scope }}
        run: >-
          python3 scripts/release_golden_path.py
          --candidate-bom candidate/bom.json
          --previous-candidate-bom previous/bom.json
          --part "$PART"
          --upgrade-scope "$UPGRADE_SCOPE"
          --evidence-output "$RUNNER_TEMP/evidence-$PART.json"
      - name: Mark a part that produced no evidence as failed
        # Part artifacts are named per run, not per attempt, so re-running only
        # the failed jobs still merges every part. A part that dies before
        # writing evidence uploads a bundle that cannot validate, replacing any
        # earlier attempt's evidence instead of letting it stand in.
        if: always()
        env:
          PART: ${{ matrix.part }}
        run: |
          evidence="$RUNNER_TEMP/evidence-$PART.json"
          test -s "$evidence" || printf '{"schema": "missing"}\n' > "$evidence"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: smoke-part-${{ github.run_id }}-${{ matrix.host }}-${{ matrix.part }}
          path: |
            ${{ runner.temp }}/evidence-${{ matrix.part }}.json
            ${{ runner.temp }}/evidence-${{ matrix.part }}-observatory/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  golden-path:
    needs: [distributions, smoke]
    if: ${{ !cancelled() && needs.distributions.result == 'success' }}
    name: build / artifact golden path (${{ matrix.host }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    continue-on-error: ${{ matrix.host == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.hosts) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-set-${{ needs.distributions.outputs.sha }}
          path: candidate
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: smoke-part-${{ github.run_id }}-${{ matrix.host }}-*
          path: parts
          merge-multiple: true
      - name: Merge and validate the evidence of every part
        # A missing or failed part fails here: the merged bundle must hold every demonstration.
        run: >-
          python3 scripts/validate_release_evidence.py
          --bundle parts/evidence-core.json
          --bundle parts/evidence-observatory-fresh.json
          --bundle parts/evidence-observatory-upgrade.json
          --candidate-bom candidate/bom.json
          --output "$RUNNER_TEMP/evidence.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: smoke-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.host }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: warn
          retention-days: 14
