name: Dependency remediation handoff

on:
  workflow_call:
    secrets:
      PHLO_DEPENDENCY_TRIAGE_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: dependency-remediation-handoff
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      # Only protected default-branch code runs with issue/PR-comment permissions.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          persist-credentials: false
      - name: Authenticate assessment and hand off owned remediation
        env:
          GH_TOKEN: ${{ secrets.PHLO_DEPENDENCY_TRIAGE_TOKEN || github.token }}
          SCAN_RUN: ${{ github.run_id }}
          SCAN_ATTEMPT: ${{ github.run_attempt }}
          SCAN_SHA: ${{ github.sha }}
        # Human-owned, issues/PR-write token enables existing signed webhook intake.
        # Without it, bot issues still record risks but require maintainer triage.
        run: >-
          python3 scripts/report_dependency_risk.py --run-id "$SCAN_RUN"
          --run-attempt "$SCAN_ATTEMPT" --sha "$SCAN_SHA"
