name: Security

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      base-sha:
        type: string
        default: ''
      head-sha:
        type: string
        default: ''
      mode:
        type: string
        default: release
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  workflow-hardening:
    name: security / workflow hardening
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Audit workflow security with zizmor
        run: make zizmor

  dependencies:
    name: security / dependency assessment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The caller must be trusted. Inspected revisions are read as Git data only.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - name: Assess every tracked lock at the exact revision
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
          MODE: ${{ inputs.mode || 'queue' }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="${HEAD_SHA:-$EVENT_SHA}"
          base="${BASE_SHA:-$head}"
          python3 scripts/dependency_delta.py --base "$base" --head "$head" --mode "$MODE" --output dependency-assessment.json
      - name: Preserve assessment even when risks block
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-assessment-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-assessment.json
          if-no-files-found: error

  security-status:
    name: security / status
    if: always()
    needs: [workflow-hardening, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete successful independent checks
        env:
          HARDENING: ${{ needs.workflow-hardening.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
        run: |
          test "$HARDENING" = success
          test "$DEPENDENCIES" = success
