name: Security

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  workflow-hardening:
    name: security / workflow hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Audit workflow security with zizmor
        run: make zizmor

  python-dependencies:
    name: security / python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Audit Python dependencies
        shell: bash
        run: uv audit --locked

  observatory-dependencies:
    name: security / npm dependencies (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [packages/phlo-observatory/src/phlo_observatory, apps/phlo-agent]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  docs-dependencies:
    name: security / docs site generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Install pymdx
        run: uv tool install "pymdx==0.1.4"

      - name: Generate docs site
        run: pymdx generate src/phlo --docs docs --output docs-site

      - name: Build docs site
        run: pymdx build docs-site

  security-status:
    name: security / status
    if: always()
    needs:
      - workflow-hardening
      - python-dependencies
      - observatory-dependencies
      - docs-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Require every security check to succeed
        env:
          WORKFLOW_HARDENING: ${{ needs.workflow-hardening.result }}
          PYTHON_DEPENDENCIES: ${{ needs.python-dependencies.result }}
          OBSERVATORY_DEPENDENCIES: ${{ needs.observatory-dependencies.result }}
          DOCS_DEPENDENCIES: ${{ needs.docs-dependencies.result }}
        run: |
          set -euo pipefail
          for result in "$WORKFLOW_HARDENING" "$PYTHON_DEPENDENCIES" "$OBSERVATORY_DEPENDENCIES" "$DOCS_DEPENDENCIES"; do
            if [ "$result" != "success" ]; then
              echo "::error::Required security check finished with result: $result"
              exit 1
            fi
          done
