name: PR Validation

on:
  # No base-branch filter: stacked PRs targeting feature branches get the
  # same validation as PRs targeting main/beta. Merge-queue gating below is
  # unchanged.
  pull_request:
  merge_group:
  workflow_call:

# Cancel only an obsolete revision of the same PR. Merge groups have distinct
# refs and must not cancel one another or a reusable child workflow.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: pr / changed lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      code: ${{ steps.select.outputs.code }}
      python: ${{ steps.select.outputs.python }}
      integration: ${{ steps.select.outputs.integration }}
      docs: ${{ steps.select.outputs.docs }}
      mutation: ${{ steps.select.outputs.mutation }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select affected lanes
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            # The event base can precede the merge commit's parent. Fetch both
            # exact endpoints without changing the checked-out merge result.
            git fetch --no-tags --no-recurse-submodules --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
            git cat-file -e "$BASE_SHA^{commit}"
            git cat-file -e "$HEAD_SHA^{commit}"
            selection="$(python3 scripts/select_ci.py --base "$BASE_SHA" --head "$HEAD_SHA")"
          else
            selection="$(python3 scripts/select_ci.py --base HEAD --head HEAD)"
          fi
          {
            echo "selection=$selection"
            echo "code=$(jq '[.python, .frontend, .writer, .plugin, .integration, .mutation] | any' <<< "$selection")"
            echo "python=$(jq -r .python <<< "$selection")"
            echo "integration=$(jq -r .integration <<< "$selection")"
            echo "docs=$(jq -r .docs <<< "$selection")"
            echo "mutation=$(jq -r .mutation <<< "$selection")"
          } >> "$GITHUB_OUTPUT"
          jq .reasons <<< "$selection" >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      selection: ${{ needs.changes.outputs.selection }}

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true' || needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/integration.yml

  containers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/container-security.yml

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs-build.yml

  mutation:
    needs: changes
    if: needs.changes.outputs.mutation == 'true'
    uses: ./.github/workflows/mutation.yml

  security:
    name: security / introduced dependency risk
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Resolve security comparison base
        id: base
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A branch-creation push has no previous revision, like a manual run.
          if [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            BASE_SHA="$HEAD_SHA"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Inventory new suppressions and skips
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/check_new_suppressions.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Compare locked dependencies with the tested base
        id: assessment
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Existing findings belong to nightly Security and agent triage.
          # Both PR and merge-group checks block newly introduced vulnerable versions.
          mode='delta'
          ledger="$RUNNER_TEMP/dependency-risks.json"
          if git cat-file -e "$BASE_SHA:security/dependency-risks.json" 2>/dev/null; then
            git show "$BASE_SHA:security/dependency-risks.json" > "$ledger"
          else
            printf '[]\n' > "$ledger"
          fi
          python3 scripts/dependency_delta.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            --mode "$mode" --ledger "$ledger" --output "$RUNNER_TEMP/dependency-delta.json"
      - name: Upload dependency assessment
        if: always() && steps.assessment.outcome != 'skipped'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dependency-delta
          path: ${{ runner.temp }}/dependency-delta.json
          if-no-files-found: error

  required:
    name: pr / required
    if: always()
    needs: [changes, ci, integration, containers, security, docs, mutation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require all correctness and introduced-risk checks
        env:
          CI: ${{ needs.ci.result }}
          CHANGES: ${{ needs.changes.result }}
          CODE_SELECTED: ${{ needs.changes.outputs.code }}
          INTEGRATION: ${{ needs.integration.result }}
          INTEGRATION_SELECTED: ${{ needs.changes.outputs.integration }}
          PYTHON_SELECTED: ${{ needs.changes.outputs.python }}
          CONTAINERS: ${{ needs.containers.result }}
          SECURITY: ${{ needs.security.result }}
          DOCS: ${{ needs.docs.result }}
          DOCS_SELECTED: ${{ needs.changes.outputs.docs }}
          MUTATION: ${{ needs.mutation.result }}
          MUTATION_SELECTED: ${{ needs.changes.outputs.mutation }}
        run: |
          set -euo pipefail
          test "$CHANGES" = success
          expected_code=skipped
          if [ "$CODE_SELECTED" = true ]; then expected_code=success; fi
          for result in "$CI" "$CONTAINERS" "$SECURITY"; do
            if [ "$result" != "$expected_code" ]; then
              echo "::error::Required PR lane expected $expected_code, got $result"
              exit 1
            fi
          done
          if [ "$INTEGRATION_SELECTED" = true ] || [ "$PYTHON_SELECTED" = true ]; then
            test "$INTEGRATION" = success
          else
            test "$INTEGRATION" = skipped
          fi
          if [ "$DOCS_SELECTED" = true ]; then
            test "$DOCS" = success
          else
            test "$DOCS" = skipped
          fi
          if [ "$MUTATION_SELECTED" = true ]; then
            test "$MUTATION" = success
          else
            test "$MUTATION" = skipped
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: github.event_name == 'merge_group'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        if: github.event_name == 'merge_group'
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Record authenticated full-queue evidence and job timings
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project --with pyyaml==6.0.3 python scripts/ci_evidence.py emit
          --output merge-validation.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: github.event_name == 'merge_group'
        with:
          name: merge-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: merge-validation.json
          if-no-files-found: error
          retention-days: 30
