name: Container Rescan

on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 * * *"

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  rescan:
    name: containers / published digest rescan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Select latest published release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check out published fleet definitions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: released
          persist-credentials: false
      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.12.1"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22
        with:
          cosign-release: v3.0.5
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate waiver expiry
        run: uv run --no-project --with pyyaml==6.0.3 python scripts/container_security.py validate-waivers
      - name: Resolve the complete latest released fleet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published resolved
          uv run --no-project --with pyyaml==6.0.3 python released/scripts/container_security.py \
            published-fleet --root released > "$RUNNER_TEMP/expected-fleet.json"
          jq -c '.[]' "$RUNNER_TEMP/expected-fleet.json" | while read -r target; do
            image="$(jq -r .image <<< "$target")"
            services="$(jq -c .services <<< "$target")"
            digest="$(
              docker buildx imagetools inspect \
                --format '{{json .Manifest.Digest}}' "$image" | jq -r .
            )"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            safe="$(tr -d '\n' <<< "$image" | tr '/:@' '___')"
            jq -n --arg image "$image" --arg digest "$digest" --argjson services "$services" \
              '{image: $image, digest: $digest, services: $services}' > "resolved/${safe}.json"
          done
          jq -s '.' resolved/*.json > "$RUNNER_TEMP/resolved-fleet.json"
          uv run --no-project --with pyyaml==6.0.3 python released/scripts/container_security.py \
            assemble-rescan-manifest --root released --records "$RUNNER_TEMP/resolved-fleet.json" \
            --output published/generated-service-images.json
      - name: Include the latest independently published MinIO image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GH_REPO/actions/workflows/publish-minio.yml/runs?branch=main&event=workflow_dispatch&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [[ -z "$run" ]]; then
            echo 'MinIO has no successful independent publication yet.'
            exit 0
          fi
          gh api --paginate --slurp 'orgs/phlohouse/packages/container/phlo-minio/versions?per_page=100' |
            jq -e '[.[][] | . as $version | .metadata.container.tags[] |
              select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) |
              {image: ("ghcr.io/phlohouse/phlo-minio:" + .), digest: $version.name,
               services: ["minio", "minio-setup"], created: $version.created_at}] |
              if length == 0 then error("published MinIO package has no versioned images")
              else max_by(.created) | del(.created) end |
              if .digest | test("^sha256:[0-9a-f]{64}$") then .
              else error("invalid published MinIO digest") end' > "$RUNNER_TEMP/minio-image.json"
          jq --slurpfile minio "$RUNNER_TEMP/minio-image.json" \
            '. + $minio | unique_by(.image)' published/generated-service-images.json \
            > "$RUNNER_TEMP/rescan-images.json"
          mv "$RUNNER_TEMP/rescan-images.json" published/generated-service-images.json
      - name: Reconcile published bytes and signatures against the release BOM
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p published/downloads published/candidate/distributions reports
          gh release download "$RELEASE_TAG" --pattern bom.json --dir published/candidate
          gh release download "$RELEASE_TAG" --pattern '*.whl' --pattern '*.tar.gz' \
            --dir published/downloads
          python3 - <<'PY'
          import shutil
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import release_candidate_bom as candidate_bom
          candidate = Path("published/candidate")
          bom = candidate_bom.load_bom(candidate / "bom.json")
          digests = {
              artifact["digest"] for artifact in bom["artifacts"]
              if artifact["kind"] in (candidate_bom.KIND_WHEEL, candidate_bom.KIND_SDIST)
          }
          for path in Path("published/downloads").iterdir():
              if candidate_bom.file_sha256(path) in digests:
                  shutil.copyfile(path, candidate / "distributions" / path.name)
          PY
          python3 scripts/promote_release_candidate.py verify-published \
            --candidate-bom published/candidate/bom.json --staging-dir published/candidate \
            --report-output reports/publication-audit.json
      - name: Verify signatures for every first-party rescan subject
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p reports
          jq -ce '.[] | select(.image | startswith("ghcr.io/phlohouse/"))' \
            published/generated-service-images.json > "$RUNNER_TEMP/signature-targets.jsonl"
          while read -r target; do
            image="$(jq -r .image <<< "$target")"
            digest="$(jq -r .digest <<< "$target")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            workflow=release-promotion.yml
            if [[ "${image%:*}" = ghcr.io/phlohouse/phlo-minio ]]; then
              workflow=publish-minio.yml
            fi
            safe="$(tr -d '\n' <<< "$image" | tr '/:@' '___')"
            cosign verify --certificate-identity \
              "https://github.com/phlohouse/phlo/.github/workflows/$workflow@refs/heads/main" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "${image%:*}@$digest" > "reports/${safe}-signatures.json"
          done < "$RUNNER_TEMP/signature-targets.jsonl"
      - name: Rescan immutable images with fresh Trivy data
        if: ${{ !cancelled() }}
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          failed=0
          jq -ce 'if type == "array" and length > 0 then .[] else error("empty fleet") end' \
            published/generated-service-images.json > "$RUNNER_TEMP/rescan-targets.jsonl"
          while read -r target; do
            image="$(jq -r .image <<< "$target")"
            digest="$(jq -r .digest <<< "$target")"
            safe="$(tr -d '\n' <<< "$image" | tr '/:@' '___')"
            report="reports/${safe}.json"
            if ! docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v "$PWD:/work" -w /work aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
              image --format json --output "/work/$report" --scanners vuln "$image@$digest"; then
              echo "::error::Scanner failed for $image@$digest"
              failed=1
              continue
            fi
            uv run --no-project --with pyyaml==6.0.3 python scripts/container_security.py \
              apply-policy --image "$image@$digest" --report "$report" || failed=1
          done < "$RUNNER_TEMP/rescan-targets.jsonl"
          exit "$failed"
      - name: Upload rescan reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: container-rescan-${{ github.run_id }}
          path: |
            published/generated-service-images.json
            reports
          if-no-files-found: warn
