name: Configure Docker Hub mirror
description: Use Google's public Docker Hub mirror without stopping running containers
runs:
  using: composite
  steps:
    - name: Reload Docker registry mirror configuration
      shell: bash
      run: |
        set -euo pipefail
        config="$(mktemp)"
        trap 'rm -f "$config"' EXIT
        if sudo test -f /etc/docker/daemon.json; then
          sudo cat /etc/docker/daemon.json
        else
          echo '{}'
        fi | jq '."registry-mirrors" = ["https://mirror.gcr.io"]' > "$config"
        sudo install -m 0644 "$config" /etc/docker/daemon.json
        sudo systemctl kill --kill-whom=main --signal=HUP docker.service
        for attempt in {1..10}; do
          if docker info --format '{{json .RegistryConfig.Mirrors}}' | jq -e 'any(.[]; rtrimstr("/") == "https://mirror.gcr.io")'; then
            exit 0
          fi
          sleep 1
        done
        echo '::error::Docker did not load its registry mirror'
        exit 1
