name: Build source MinIO image
description: Build checkout sources and share compilation cache while refreshing runtime packages
inputs:
  image:
    description: Local image tag for the checkout-built MinIO image
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/docker-mirror
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      with:
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
    - name: Build MinIO from checked-in sources
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      env:
        DOCKER_BUILD_RECORD_UPLOAD: "false"
      with:
        context: packages/phlo-minio/src/phlo_minio
        file: packages/phlo-minio/src/phlo_minio/Dockerfile
        platforms: linux/amd64
        tags: ${{ inputs.image }}
        load: true
        push: false
        # Reuse source compilation while retaining fresh runtime OS upgrades.
        no-cache-filters: runtime
        cache-from: |
          type=gha,scope=minio-amd64
          type=gha,scope=integration-minio-amd64
        cache-to: type=gha,scope=integration-minio-amd64,mode=max,ignore-error=true
