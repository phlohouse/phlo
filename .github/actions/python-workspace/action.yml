name: Prepare Python workspace
description: Install pinned uv and Python, then sync locked dependencies
inputs:
  python-version:
    description: Python version
    required: false
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
      with:
        version: "0.12.1"
    - name: Install Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}
    - name: Sync workspace
      shell: bash
      run: uv sync --dev --locked
