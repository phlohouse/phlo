[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
coverage-report = ["coverage==7.13.5"]
dev = [
    "phlo-alerting>=0.1.0",
    "phlo-alloy>=0.1.0",
    "phlo-airbyte>=0.1.0",
    "phlo-api>=0.1.0",
    "phlo-core-plugins>=0.1.0",
    "phlo-dagster>=0.3.2",
    "phlo-delta>=0.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "sqlfluff>=4.2.0",
    "phlo-clickstack>=0.1.0",
    "phlo-clickhouse>=0.1.0",
    "phlo-dlt>=0.3.2",
    "phlo-iceberg>=0.3.2",
    "phlo-dbt>=0.1.0",
    "dbt-duckdb>=1.9,<1.12",
    "phlo-grafana>=0.1.0",
    "phlo-hasura>=0.1.0",
    "phlo-kafka>=0.1.0",
    "phlo-lineage>=0.3.2",
    "phlo-loki>=0.1.0",
    "phlo-mcp>=0.1.0",
    "phlo-minio>=0.16.1",
    "phlo-sling>=0.1.0",
    "phlo-nessie>=0.3.2",
    "phlo-observatory>=0.1.0",
    "phlo-observe-plugin>=0.1.0",
    "phlo-observe>=0.2.3,<0.3",
    "phlo-polaris>=0.1.0",
    "phlo-observatory-example>=0.1.0",
    "phlo-openmetadata>=0.1.0",
    "phlo-otel>=0.1.0",
    "phlo-oauth2-proxy>=0.1.0",
    "phlo-pandera>=0.3.2",
    "phlo-pgweb>=0.1.0",
    "phlo-postgres>=0.1.0",
    "phlo-postgrest>=0.1.0",
    "phlo-prometheus>=0.1.0",
    "phlo-rustfs>=0.1.0",
    "phlo-superset>=0.1.0",
    "phlo-testing>=0.1.0",
    "phlo-traefik>=0.1.0",
    "phlo-transform>=0.1.0",
    "phlo-trino>=0.1.0",
    "asyncpg>=0.30.0",
    "dagster>=1.13,<1.14",
    "dagster-postgres>=0.29,<0.30",
    "dagster-webserver>=1.13,<1.14",
    "duckdb>=0.9.0",
    "fastapi>=0.127.0,<0.137",
    "libcst>=1.5.0",
    "pandas>=2.3.3",
    "pandera>=0.26.1",
    "psycopg2-binary>=2.9.11",
    "ruff>=0.14.1",
    "import-linter>=2.15",
    "ty==0.0.29",
    "testcontainers>=4.13.3",
    "pyiceberg>=0.10.0,<0.12",
    "s3fs>=2026.6.0",
    "pymdx>=0.1.1",
    "minio>=7.2.20",
    "pytest-xdist>=3.8",
    "pytest-timeout>=2.4",
]

[project]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0.1",
    "pydantic-settings>=2.14.2",
    "click>=8.3.3",
    "rich>=13.0",
    "httpx>=0.28.1",
    "PyJWT[crypto]>=2.15.0",
    "structlog>=25.5.0",
    "jsonschema>=4.23.0",
    "packaging>=24.0",
]
description = "Lakehouse platform"
license = "AGPL-3.0-or-later"
name = "phlo"
readme = "README.md"
requires-python = ">=3.12"
version = "0.18.0"

[project.entry-points."phlo.plugins.quality"]

[project.entry-points."phlo.plugins.sources"]

[project.entry-points."phlo.plugins.transforms"]

[project.optional-dependencies]
codemods = ["libcst>=1.5.0"]
core-services = [
    "phlo-dagster>=0.3.2",
    "phlo-postgres>=0.1.0",
    "phlo-minio>=0.16.1",
    "phlo-nessie>=0.3.2",
    "phlo-trino>=0.1.0",
]
defaults = [
    "phlo-core-plugins>=0.1.0",
    "phlo-api>=0.1.0",
    "phlo-iceberg>=0.3.2",
    "phlo-dlt>=0.3.2",
    "phlo-dbt>=0.1.0",
    "phlo-pandera>=0.3.2",
    "phlo-dagster>=0.3.2",
    "phlo-postgres>=0.1.0",
    "phlo-minio>=0.16.1",
    "phlo-nessie>=0.3.2",
    "phlo-observatory>=0.1.0",
    "phlo-observe-plugin>=0.1.0",
    "phlo-trino>=0.1.0",
]
observe = ["phlo-observe-plugin>=0.1.0"]
openmetadata = ["phlo-openmetadata>=0.1.0"]
runtime = [
    "asyncpg>=0.30.0",
    "dagster>=1.13,<1.14",
    "dagster-webserver>=1.13,<1.14",
    "duckdb>=0.9.0",
    "fastapi>=0.127.0,<0.137",
    "pandas>=2.3.3",
    "pandera>=0.26.1",
    "psycopg2-binary>=2.9.11",
]

[project.scripts]
phlo = "phlo.cli.main:cli"

[tool.hatch.build.targets.sdist]
include = [
    "src/phlo",
    "registry/schema/v1.json",
    "registry/plugins.json",
    "registry/support/v1.json",
    "registry/support/schema/v1.json",
]

[tool.hatch.build.targets.wheel]
include = [
    "src/phlo/plugins/registry_data.json",
    "src/phlo/support_data/v1.json",
    "src/phlo/sql/*.sql",
]
packages = ["src/phlo"]

[tool.importlinter]
exclude_type_checking_imports = false
root_packages = [
    "phlo",
    "phlo_iceberg",
    "phlo_dagster",
]

[[tool.importlinter.contracts]]
ancestors = [
    "phlo.*",
    "phlo_iceberg",
    "phlo_dagster",
]
name = "Subpackages and providers have no import cycles"
type = "acyclic_siblings"

[[tool.importlinter.contracts]]
forbidden_modules = [
    "phlo.plugins",
    "phlo.helpers",
    "phlo.infrastructure",
    "phlo.application",
    "phlo.cli",
    "phlo.logging",
]
name = "Capability definitions do not depend on application composition"
source_modules = ["phlo.capabilities.*"]
type = "forbidden"

[[tool.importlinter.contracts]]
as_packages = false
forbidden_modules = [
    "phlo",
    "phlo.capabilities",
    "phlo.helpers",
]
name = "Core never imports public aggregators inward"
source_modules = ["phlo.**"]
type = "forbidden"

[[tool.importlinter.contracts]]
forbidden_modules = ["phlo.cli"]
name = "CLI is an outer layer"
source_modules = [
    "phlo.application",
    "phlo.capabilities",
    "phlo.helpers",
    "phlo.infrastructure",
    "phlo.plugins",
    "phlo.security",
    "phlo.config",
    "phlo.hooks",
    "phlo.operations",
    "phlo.migrations",
    "phlo.run_evidence",
    "phlo.logging",
    "phlo.telemetry",
]
type = "forbidden"

[[tool.importlinter.contracts]]
layers = [
    "phlo.__main__ : phlo.cli",
    "phlo.application : phlo.infrastructure : phlo.helpers : phlo.plugins : phlo.logging",
    "phlo.capabilities.resolver : phlo.capabilities.authentication : phlo.capabilities.authorization : phlo.capabilities.authorization_opa : phlo.capabilities.maintenance : phlo.capabilities.telemetry : phlo.capabilities.external_refs : phlo.capabilities.table_store",
    "phlo.capabilities.registry",
    "phlo.capabilities.specs",
    "phlo.capabilities.interfaces : phlo.capabilities.runtime : phlo.capabilities.support : phlo.capabilities.settings : phlo.capabilities.continuity : phlo.capabilities.history : phlo.capabilities.inventory : phlo.capabilities.workflow_wizard : phlo.capabilities.catalog : phlo.migrations.specs : phlo.run_evidence.contracts : phlo.security.adapters : phlo.security.readiness : phlo.dataset : phlo.hooks.events : phlo.contracts : phlo.run_evidence.reconciliation : phlo.run_evidence.models : phlo.run_evidence.redaction : phlo.run_evidence.stored",
    "phlo.config : phlo.config_schema : phlo.exceptions : phlo.logging_context : phlo._attempt : phlo._correlation",
]
name = "Application capability and domain layering"
type = "layers"

[[tool.importlinter.contracts]]
containers = ["phlo.rbac"]
layers = [
    "sync",
    "registry",
    "compilers",
    "compiler",
    "config",
    "models",
]
name = "RBAC layering"
type = "layers"

[tool.mutmut]
also_copy = ["conftest.py"]
only_mutate = [
    "src/phlo/security/mode.py",
    "src/phlo/quality_rules.py",
    "src/phlo/config/project.py",
]
pytest_add_cli_args_test_selection = [
    "tests/security/test_mode.py",
    "tests/plugins/test_provider_neutral_quality_api.py",
    "tests/cli/test_cli_services_utils.py",
]
source_paths = ["src/"]

[tool.pytest.ini_options]
addopts = "--ignore=src --strict-config --continue-on-collection-errors --import-mode=importlib --strict-markers -m 'not integration'"
empty_parameter_set_mark = "fail_at_collect"
xfail_strict = true
filterwarnings = [
    "error",
    "ignore:Using `@model_validator` with mode='after' on a classmethod is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
markers = [
    "integration: marks tests that need external services, subprocess tooling, or a full stack (default runs exclude them)",
    "core_regression: marks high-signal core runtime regression checks (run with '-m core_regression')",
]
norecursedirs = [
    "src",
    ".venv",
]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = [
    "tests",
    "packages/*/tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["E501"]
select = [
    "E",
    "F",
    "I",
    "UP",
    "SIM",
    "RET",
    "C4",
    "C90",
    "PIE",
    "B",
    "DTZ",
    "PTH",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["C901"]
"tests/**" = ["C901"]

[tool.ty.environment]
extra-paths = [
    "packages/phlo-airbyte/src",
    "packages/phlo-alerting/src",
    "packages/phlo-alloy/src",
    "packages/phlo-api/src",
    "packages/phlo-clickstack/src",
    "packages/phlo-clickhouse/src",
    "packages/phlo-core-plugins/src",
    "packages/phlo-dagster/src",
    "packages/phlo-dbt/src",
    "packages/phlo-delta/src",
    "packages/phlo-dlt/src",
    "packages/phlo-sling/src",
    "packages/phlo-grafana/src",
    "packages/phlo-hasura/src",
    "packages/phlo-iceberg/src",
    "packages/phlo-lineage/src",
    "packages/phlo-loki/src",
    "packages/phlo-mcp/src",
    "packages/phlo-otel/src",
    "packages/phlo-polaris/src",
    "packages/phlo-kafka/src",
    "packages/phlo-minio/src",
    "packages/phlo-nessie/src",
    "packages/phlo-observatory-example/src",
    "packages/phlo-observatory/src",
    "packages/phlo-observe-plugin/src",
    "packages/phlo-oauth2-proxy/src",
    "packages/phlo-openmetadata/src",
    "packages/phlo-pgweb/src",
    "packages/phlo-postgres/src",
    "packages/phlo-postgrest/src",
    "packages/phlo-prometheus/src",
    "packages/phlo-pandera/src",
    "packages/phlo-rustfs/src",
    "packages/phlo-superset/src",
    "packages/phlo-testing/src",
    "packages/phlo-traefik/src",
    "packages/phlo-transform/src",
    "packages/phlo-trino/src",
]
python-version = "3.12"
root = ["./src"]

[tool.ty.rules]
invalid-argument-type = "error"
invalid-assignment = "error"
invalid-method-override = "error"
invalid-raise = "error"
invalid-return-type = "error"
invalid-type-form = "error"
missing-argument = "error"
no-matching-overload = "error"
possibly-missing-submodule = "error"
too-many-positional-arguments = "error"
unknown-argument = "error"
unresolved-attribute = "error"
unsupported-operator = "error"

[tool.ty.src]
exclude = ["**/testing/**"]

