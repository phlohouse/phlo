[project]
ecosystem = "python"

[release]
branch = "main"
tag_prefix = "v"
changelog_file = "CHANGELOG.md"
pr_title = "chore(release): {version}"

[versioning]
strategy = "conventional_commits"
initial_version = "0.7.0"

[[version_files]]
path = "pyproject.toml"
key = "project.version"

[[release.replacements]]
files = ["registry/support/v1.json", "src/phlo/support_data/v1.json"]
packages = ["phlo"]
search = "\"version\": \"{current_version}\",\n    \"maturity\": \"alpha\""
replace = "\"version\": \"{next_version}\",\n    \"maturity\": \"alpha\""
expected_matches = 1

[[release.replacements]]
files = ["registry/support/v1.json", "src/phlo/support_data/v1.json"]
packages = [
    "phlo",
    "phlo-api",
    "phlo-core-plugins",
    "phlo-dagster",
    "phlo-dbt",
    "phlo-dlt",
    "phlo-iceberg",
    "phlo-minio",
    "phlo-nessie",
    "phlo-observatory",
    "phlo-pandera",
    "phlo-postgres",
    "phlo-trino",
]
search = "\"name\": \"{name}\", \"version\": \"{current_version}\""
replace = "\"name\": \"{name}\", \"version\": \"{next_version}\""
expected_matches = 1

[[release.replacements]]
files = ["registry/support/v1.json", "src/phlo/support_data/v1.json"]
packages = ["phlo-api", "phlo-observatory"]
search = "\"image_reference\": \"ghcr.io/phlohouse/{name}:{current_version}\""
replace = "\"image_reference\": \"ghcr.io/phlohouse/{name}:{next_version}\""
expected_matches = 1

[[release.replacements]]
files = ["registry/support/v1.json", "src/phlo/support_data/v1.json"]
packages = ["phlo-dagster"]
search = "\"image_reference\": \"ghcr.io/phlohouse/{name}:{current_version}\""
replace = "\"image_reference\": \"ghcr.io/phlohouse/{name}:{next_version}\""
expected_matches = 2

[[release.replacements]]
files = [
    "packages/phlo-dagster/src/phlo_dagster/service.yaml",
    "packages/phlo-dagster/src/phlo_dagster/dagster-daemon.yaml",
]
packages = ["phlo-dagster"]
search = "image: ghcr.io/phlohouse/{name}:{current_version}"
replace = "image: ghcr.io/phlohouse/{name}:{next_version}"
# ReleaseX checks this count independently for each package/file pair.
expected_matches = 1

[[release.replacements]]
files = ["packages/phlo-api/src/phlo_api/service.yaml"]
packages = ["phlo-api"]
search = "image: ghcr.io/phlohouse/{name}:{current_version}"
replace = "image: ghcr.io/phlohouse/{name}:{next_version}"
expected_matches = 1

[[release.replacements]]
files = ["packages/phlo-observatory/src/phlo_observatory/service.yaml"]
packages = ["phlo-observatory"]
search = "image: ghcr.io/phlohouse/{name}:{current_version}"
replace = "image: ghcr.io/phlohouse/{name}:{next_version}"
expected_matches = 1

[[release.replacements]]
files = ["examples/lakehouses/retail-files/pyproject.toml"]
packages = ["phlo"]
search = "phlo[defaults]=={current_version}"
replace = "phlo[defaults]=={next_version}"
expected_matches = 1

[[release.replacements]]
files = ["examples/lakehouses/retail-files/pyproject.toml"]
packages = ["phlo-dagster", "phlo-dbt", "phlo-pandera"]
search = "{name}=={current_version}"
replace = "{name}=={next_version}"
expected_matches = 1

[[release.replacements]]
files = ["examples/lakehouses/retail-files/src/phlo_retail_files/blueprint_contract.json"]
packages = ["phlo"]
search = "phlo[defaults]=={current_version}"
replace = "phlo[defaults]=={next_version}"
expected_matches = 2

[[release.replacements]]
files = ["examples/lakehouses/retail-files/src/phlo_retail_files/blueprint_contract.json"]
packages = ["phlo-dagster", "phlo-dbt", "phlo-pandera"]
search = "{name}=={current_version}"
replace = "{name}=={next_version}"
expected_matches = 2

[changelog]
sections.feat = "Added"
sections.fix = "Fixed"
sections.refactor = "Changed"
sections.perf = "Changed"
sections.docs = false
sections.chore = false
sections.ci = false
sections.build = false
sections.style = false
sections.test = false

[publish]
enabled = true
provider = "uv"
repository = "pypi"
dist_dir = "dist"
trusted_publishing = false
oidc = false
token_env = "PYPI_API_TOKEN"

[github]
token_env = "GITHUB_TOKEN"
release_branch_prefix = "relx/release"
pending_label = "autorelease: pending"
tagged_label = "autorelease: tagged"

[[channels]]
branch = "main"
publish = true

[[channels]]
branch = "beta"
publish = true
prerelease = "b"

[monorepo]
enabled = true
release_mode = "release_set"

[workspace]
cascade_bumps = false

[workspace.dependencies]
enabled = true

[[workspace.dependencies.rules]]
dependency = "phlo"
dependents = ["packages/*"]
when = "dependency_selected"
range = ">={version},<{next_minor}"

[[workspace.dependencies.rules]]
dependency = "phlo-postgres"
dependents = ["packages/phlo-polaris"]
when = "dependency_selected"
range = ">={version},<{next_minor}"

[prerelease]
enabled = true

[prerelease.workspace]
sync_root_extras = ["defaults", "core-services"]
