[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=45",
    "wheel",
]

[project]
dependencies = ["phlo>=0.14.0,<0.15"]
description = "loki service plugin for Phlo"
name = "phlo-loki"
requires-python = ">=3.11"
version = "0.14.0"

[[project.authors]]
email = "team@phlo.dev"
name = "Phlo Team"

[project.entry-points."phlo.plugins.observatory"]
loki = "phlo_loki.observatory_plugin:LokiObservatoryExtension"

[project.entry-points."phlo.plugins.services"]
loki = "phlo_loki.plugin:LokiServicePlugin"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
observatory = ["phlo-observatory>=0.1.0"]

[project.readme]
content-type = "text/plain"
text = "loki service plugin for Phlo."

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
phlo_loki = [
    "service.yaml",
    "loki-config.yml",
    "observatory_assets/*",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
