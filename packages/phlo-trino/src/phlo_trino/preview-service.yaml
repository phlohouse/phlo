# Read-only Trino for Observatory's Query page and notebook SQL cells.
# phlo adds it whenever phlo-api and trino are both installed. phlo-api makes
# its TLS certificate and per-environment passwords on start (see
# phlo_api.preview_bootstrap); this container copies them into a private
# tmpfs, derives one read-only catalog per environment from the main Iceberg
# catalog, and then runs Trino as its own user with the preview budgets.
name: trino-preview
description: Read-only Trino for Observatory queries, with per-environment identities and query budgets
category: core
default: false
profile: api
# Added with phlo-api and trino, but started beside the API rather than after
# it is healthy: the entrypoint waits only for the files the API writes first.
companion_of:
  - trino
  - phlo-api

image: trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534

depends_on:
  - trino

compose:
  # A project without environments, or with its own preview server, has
  # nothing to serve here: the container idles and reports healthy.
  restart: on-failure
  # Root only long enough to copy phlo-api's 0700 files into the tmpfs and
  # hand them to Trino's user; see security/container-waivers.yml.
  user: "0:0"
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_READ_SEARCH
    - SETGID
    - SETUID
    - SYS_CHROOT
  security_opt:
    - no-new-privileges:true
  entrypoint: ["/bin/bash", "/etc/trino-preview/entrypoint.sh"]
  command: ["/usr/lib/trino/bin/run-trino"]
  environment:
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Run phlo services init to generate MINIO_ROOT_PASSWORD}
    AWS_REGION: us-east-1
    # "catalog ref" pairs that phlo services init expects phlo-api to publish.
    PHLO_V1_PREVIEW_TARGETS: ${PHLO_V1_PREVIEW_TARGETS:-}
  mem_limit: 2g
  tmpfs:
    - /etc/trino:mode=0755
  volumes:
    - ./trino-preview:/etc/trino-preview:ro
    - ./trino/catalog/iceberg.properties:/etc/trino-source/iceberg.properties:ro
    - type: bind
      source: ./query-preview
      target: /var/lib/phlo-preview
      read_only: true
      bind:
        create_host_path: false
  healthcheck:
    test: ["CMD-SHELL", "[ -f /etc/trino/disabled ] || [ \"$(curl -fsS --cacert /etc/trino/secrets/ca.pem https://localhost:8443/v1/info/state | tr -d '\"')\" = \"ACTIVE\" ]"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 90s
    start_interval: 2s

files:
  - source: preview/entrypoint.sh
    dest: trino-preview/entrypoint.sh
  - source: jvm.config
    dest: trino-preview/jvm.config
  - source: node.properties
    dest: trino-preview/node.properties
  - source: preview/config.properties.template
    dest: trino-preview/config.properties.template
  - source: preview/access-control.properties
    dest: trino-preview/access-control.properties
  - source: preview/password-authenticator.properties
    dest: trino-preview/password-authenticator.properties
  - source: preview/resource-groups.properties
    dest: trino-preview/resource-groups.properties
  - source: preview/resource-groups.json
    dest: trino-preview/resource-groups.json
