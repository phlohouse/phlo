name: alloy
description: Grafana Alloy for log collection and shipping to Loki
category: observability
default: false
profile: observability

depends_on:
  - alloy-docker-proxy

image: grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308

compose:
  restart: unless-stopped
  labels:
    phlo.metrics.enabled: "true"
    phlo.metrics.port: "alloy:12345"
    phlo.metrics.path: "/metrics"
  command:
    - run
    - --server.http.listen-addr=0.0.0.0:12345
    - --storage.path=/tmp/alloy
    - /etc/alloy/config.alloy
  ports:
    - "${ALLOY_PORT:-12345}:12345"
  volumes:
    - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
  networks:
    - default
    - alloy-docker-api
  depends_on:
    loki:
      condition: service_started
  healthcheck:
    test: ["CMD", "pgrep", "alloy"]
    interval: 10s
    timeout: 5s
    retries: 5

env_vars:
  ALLOY_PORT:
    default: 12345
    description: Alloy HTTP port

files:
  - source: config.alloy
    dest: alloy/config.alloy
