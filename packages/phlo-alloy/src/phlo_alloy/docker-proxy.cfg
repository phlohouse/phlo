global
  log stdout format raw local0
defaults
  mode http
  timeout connect 5s
  timeout client 1h
  timeout server 1h
frontend docker
  bind :2375
  acl read_method method GET HEAD
  acl metadata path_reg ^(/v[0-9.]+)?/(_ping|version|events|networks|networks/[a-f0-9]+|containers/json|containers/[a-f0-9]+/json)$
  acl logs path_reg ^(/v[0-9.]+)?/containers/[a-f0-9]+/logs$
  http-request deny unless read_method
  http-request deny unless metadata or logs
  default_backend socket
backend socket
  server docker /var/run/docker.sock
