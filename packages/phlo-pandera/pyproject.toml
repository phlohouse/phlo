[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=45",
    "wheel",
]

[project]
dependencies = [
    "phlo>=0.16.0,<0.17",
    "pandas>=2.3.3",
    "pandera>=0.26.1",
    "click>=8.3.0",
    "rich>=14.2.0",
]
description = "Quality checks and schema utilities for Phlo"
name = "phlo-pandera"
requires-python = ">=3.11"
version = "0.15.2"

[[project.authors]]
email = "team@phlo.dev"
name = "Phlo Team"

[project.entry-points."phlo.plugins.cli"]
pandera = "phlo_pandera.cli_plugin:PanderaCliPlugin"

[project.entry-points."phlo.plugins.observatory"]
pandera = "phlo_pandera.observatory_plugin:PanderaObservatoryExtension"

[project.entry-points."phlo.plugins.quality_providers"]
pandera = "phlo_pandera.plugin:PanderaQualityProvider"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
observatory = ["phlo-observatory>=0.1.0"]

[project.readme]
content-type = "text/plain"
text = "Quality checks and Pandera utilities for Phlo."

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
phlo_pandera = [
    "schemas/**/*.py",
    "observatory_assets/*",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
