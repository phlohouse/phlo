[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=45",
    "wheel",
]

[project]
dependencies = [
    "phlo>=0.15.1,<0.16",
    "pandera[pandas]>=0.26.1",
    "pyarrow>=21.0.0",
    "pyiceberg[s3fs]>=0.11.0",
]
description = "Iceberg table-store capability plugin for Phlo"
name = "phlo-iceberg"
requires-python = ">=3.11"
version = "0.15.1"

[[project.authors]]
email = "team@phlo.dev"
name = "Phlo Team"

[project.entry-points."phlo.plugins.resources"]
iceberg = "phlo_iceberg.plugin:IcebergResourceProvider"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
minio = ["phlo-minio>=0.1.0"]
nessie = ["phlo-nessie>=0.1.0"]

[project.readme]
content-type = "text/plain"
text = "Iceberg/Nessie catalog capability plugin for Phlo."

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
