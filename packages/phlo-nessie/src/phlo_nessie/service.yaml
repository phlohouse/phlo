name: nessie
description: Git-like catalog for Iceberg tables with branch/merge support
category: core
default: true

image: ghcr.io/projectnessie/nessie:0.108.3@sha256:219709df809fcfac7abe0491b2070c8d56178ed29828fb30968a4365b62bcc8a

depends_on:
  - postgres
  - minio

compose:
  restart: unless-stopped
  labels:
    phlo.metrics.enabled: "true"
    phlo.metrics.port: "nessie:19120"
    phlo.metrics.path: "/q/metrics"
    traefik.enable: "true"
    traefik.http.routers.nessie.rule: "Host(`nessie.${TRAEFIK_DOMAIN:-phlo.localhost}`)"
    traefik.http.routers.nessie.entrypoints: "web"
    traefik.http.services.nessie.loadbalancer.server.port: "19120"
  environment:
    NESSIE_VERSION_STORE_TYPE: JDBC
    QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-phlo}
    QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-phlo}
    QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-phlo}
    nessie.catalog.default-warehouse: warehouse
    nessie.catalog.warehouses.warehouse.location: ${ICEBERG_WAREHOUSE_PATH:-s3://lake/warehouse}
    nessie.catalog.service.s3.default-options.endpoint: ${ICEBERG_S3_ENDPOINT:-http://minio:9000/}
    nessie.catalog.service.s3.default-options.path-style-access: "true"
    nessie.catalog.service.s3.default-options.region: us-east-1
    nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
    nessie.catalog.secrets.access-key.name: ${MINIO_ROOT_USER:-minio}
    nessie.catalog.secrets.access-key.secret: ${MINIO_ROOT_PASSWORD:-minio123}
    # OIDC Authentication (Quarkus)
    QUARKUS_OIDC_ENABLED: ${NESSIE_OIDC_ENABLED:-false}
    QUARKUS_OIDC_AUTH_SERVER_URL: ${NESSIE_OIDC_SERVER_URL:-}
    QUARKUS_OIDC_CLIENT_ID: ${NESSIE_OIDC_CLIENT_ID:-}
    QUARKUS_OIDC_CREDENTIALS_SECRET: ${NESSIE_OIDC_CLIENT_SECRET:-}
    QUARKUS_OIDC_TOKEN_ISSUER: ${NESSIE_OIDC_ISSUER:-}
    # Authorization
    NESSIE_SERVER_AUTHORIZATION_ENABLED: ${NESSIE_AUTHZ_ENABLED:-false}
    # Managed authorization rules rendered by phlo governance sync into
    # .phlo/nessie/authz.properties, mounted read-only for Quarkus.
    QUARKUS_CONFIG_LOCATIONS: optional:file:/deployments/phlo-authz/authz.properties
  volumes:
    - ./nessie:/deployments/phlo-authz:ro
  ports:
    - "${NESSIE_PORT:-10003}:19120"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:19120/api/v1/config"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 30s

env_vars:
  NESSIE_PORT:
    default: 10003
    description: Nessie API host port
  ICEBERG_S3_ENDPOINT:
    default: http://minio:9000/
    description: S3 endpoint advertised by the Nessie Iceberg REST catalog
  ICEBERG_WAREHOUSE_PATH:
    default: s3://lake/warehouse
    description: Physical S3 location for Nessie's warehouse identifier
  # OIDC Authentication
  NESSIE_OIDC_ENABLED:
    default: "false"
    description: "Enable OIDC/OAuth2 authentication"
  NESSIE_OIDC_SERVER_URL:
    default: ""
    description: "OIDC server URL (e.g., https://auth.example.com/realms/phlo)"
  NESSIE_OIDC_CLIENT_ID:
    default: ""
    description: "OIDC client ID"
  NESSIE_OIDC_CLIENT_SECRET:
    default: ""
    description: "OIDC client secret"
    secret: true
  NESSIE_OIDC_ISSUER:
    default: ""
    description: "OIDC token issuer URL (if different from server URL)"
  # Authorization
  NESSIE_AUTHZ_ENABLED:
    default: "false"
    description: "Enable Nessie authorization rules"

hooks:
  post_start:
    - name: init-branches
      requires: phlo_nessie
      command:
        - python3
        - -m
        - phlo_nessie.hooks
        - init-branches
      timeout_seconds: 60

files:
