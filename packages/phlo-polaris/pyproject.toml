[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=45",
    "wheel",
]

[project]
dependencies = [
    "phlo>=0.14.0,<0.15",
    "phlo-postgres>=0.14.0,<0.15",
    "requests>=2.32.5",
]
description = "Apache Polaris catalog service plugin for Phlo"
name = "phlo-polaris"
requires-python = ">=3.11"
version = "0.14.0"

[[project.authors]]
email = "team@phlo.dev"
name = "Phlo Team"

[project.entry-points."phlo.plugins.catalogs"]
iceberg = "phlo_polaris.adapters.trino:TrinoPolarisIcebergCatalogPlugin"

[project.entry-points."phlo.plugins.cli"]
polaris = "phlo_polaris.cli_plugin:PolarisCliPlugin"

[project.entry-points."phlo.plugins.resources"]
polaris = "phlo_polaris.resource_provider:PolarisResourceProvider"

[project.entry-points."phlo.plugins.services"]
polaris = "phlo_polaris.plugin:PolarisServicePlugin"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
    "pyarrow>=19.0.0",
    "pyiceberg[sql-sqlite]>=0.11.0",
    "pytest>=7.0",
    "ruff>=0.1.0",
]
iceberg = ["phlo-iceberg>=0.14.0"]

[project.readme]
content-type = "text/plain"
text = "Apache Polaris catalog service plugin for Phlo."

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
phlo_polaris = [
    "service.yaml",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
