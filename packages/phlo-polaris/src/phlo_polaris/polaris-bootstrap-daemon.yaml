name: polaris-bootstrap
description: Initialize the persistent Polaris realm without rotating existing credentials
category: catalog
default: false
image: apache/polaris-admin-tool:1.7.0@sha256:3d8a24cea57aef3b71a0d7b09e5d2278d01e7e1b30071bf6648f2a6953322cca
depends_on:
  - postgres
compose:
  restart: "no"
  environment:
    QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-phlo}
    QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-phlo}
    QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Run phlo services init to generate POSTGRES_PASSWORD}
    POLARIS_PERSISTENCE_TYPE: relational-jdbc
    POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
    POLARIS_ROOT_CREDENTIALS: ${POLARIS_ROOT_CREDENTIALS:?Run phlo services init to generate POLARIS_ROOT_CREDENTIALS}
  entrypoint: ["/bin/sh", "-ec"]
  command:
    - |
      case "$${POLARIS_ROOT_CREDENTIALS}" in
        *','*|*';'*|:*|*:|*[[:space:]]*) echo 'Invalid Polaris root credentials: expected client_id:client_secret without delimiters/whitespace' >&2; exit 1;;
        *:*) ;;
        *) echo 'Invalid Polaris root credentials: expected client_id:client_secret; repair the saved value explicitly' >&2; exit 1;;
      esac
      # The upstream launcher logs its arguments, including the root secret.
      exec java -XX:MaxRAMPercentage=80.0 -jar /deployments/polaris-admin-tool.jar bootstrap --realm=POLARIS --credential="POLARIS,$${POLARIS_ROOT_CREDENTIALS%%:*},$${POLARIS_ROOT_CREDENTIALS#*:}"
