[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=45",
    "wheel",
]

[project]
dependencies = [
    "phlo>=0.15.0,<0.16",
    "click>=8.3.0",
    "rich>=14.2.0",
    "requests>=2.32.5",
]
description = "Alerting destinations and hooks for Phlo"
name = "phlo-alerting"
requires-python = ">=3.11"
version = "0.14.0"

[[project.authors]]
email = "team@phlo.dev"
name = "Phlo Team"

[project.entry-points."phlo.plugins.cli"]
alerts = "phlo_alerting.cli_plugin:AlertingCliPlugin"

[project.entry-points."phlo.plugins.hooks"]
alerting = "phlo_alerting.hooks_plugin:AlertingHookPlugin"

[project.entry-points."phlo.plugins.resources"]
alerting = "phlo_alerting.resource_provider:AlertingResourceProvider"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.readme]
content-type = "text/plain"
text = "Alerting support for Phlo."

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
