name: superset
description: Apache Superset for business intelligence and data visualization
category: bi
default: true

image: apache/superset:6.1.0@sha256:fb3464528ec7076f91195f0ff7835755aa023e281f1bb78a84782ce7a36b3705

depends_on:
  - postgres
  - trino

compose:
  user: "1000:1000"
  restart: unless-stopped
  labels:
    phlo.metrics.enabled: "false" # Superset doesn't expose native Prometheus metrics
    traefik.enable: "true"
    traefik.http.routers.superset.rule: "Host(`superset.${TRAEFIK_DOMAIN:-phlo.localhost}`)"
    traefik.http.routers.superset.entrypoints: "web"
    traefik.http.services.superset.loadbalancer.server.port: "8088"
  environment:
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Run phlo services init to generate SUPERSET_SECRET_KEY}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${POSTGRES_USER:-phlo}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run phlo services init to generate POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB:-phlo}
    SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
    SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Run phlo services init to generate SUPERSET_ADMIN_PASSWORD}
    SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
    # The upstream image ships no Trino driver. Install the pinned driver once
    # into the persistent Superset home, as Superset's own compose setup does.
    PYTHONPATH: /app/superset_home/drivers
    UV_CACHE_DIR: /tmp/uv-cache
  command: >
    /bin/sh -c "
    (python -c 'import trino.sqlalchemy' 2>/dev/null ||
    uv pip install --quiet --no-deps --python /app/.venv/bin/python
    --target /app/superset_home/drivers
    trino==0.340.0 tzlocal==5.4.5 lz4==4.4.5 orjson==3.13.0) &&
    superset db upgrade &&
    superset fab create-admin --username $${SUPERSET_ADMIN_USER} --firstname Admin --lastname User --email $${SUPERSET_ADMIN_EMAIL} --password $${SUPERSET_ADMIN_PASSWORD} || true &&
    superset init &&
    superset run -h 0.0.0.0 -p 8088 --with-threads
    "
  ports:
    - "${SUPERSET_PORT:-10007}:8088"
  volumes:
    - superset-home:/app/superset_home

env_vars:
  SUPERSET_PORT:
    default: 10007
    description: Superset web UI port
  SUPERSET_SECRET_KEY:
    description: Superset secret key for session encryption
    secret: true
  SUPERSET_ADMIN_USER:
    default: admin
    description: Superset admin username
  SUPERSET_ADMIN_PASSWORD:
    description: Superset admin password
    secret: true
  SUPERSET_ADMIN_EMAIL:
    default: admin@example.com
    description: Superset admin email

hooks:
  post_start:
    - name: add-trino-database
      requires: phlo_trino
      command:
        - python
        - -m
        - phlo_superset.hooks
        - add-database
      timeout_seconds: 120
      # The hook runs on the host and registers the connection that the
      # Superset container uses, so the URI names Trino on the service network.
      environment:
        SUPERSET_DATABASE_NAME: iceberg
        SUPERSET_DATABASE_URI: trino://superset@trino:8080/iceberg
