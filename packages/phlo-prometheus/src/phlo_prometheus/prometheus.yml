global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Trino serves OpenMetrics at /metrics to any named user.
  - job_name: "trino"
    http_headers:
      X-Trino-User:
        values: ["prometheus"]
    static_configs:
      - targets: ["trino:8080"]
        labels:
          service: trino

  # MinIO serves per-bucket usage on a second path.
  - job_name: "minio-buckets"
    metrics_path: /minio/v2/metrics/bucket
    static_configs:
      - targets: ["minio:9000"]
        labels:
          service: minio

  # Auto-discover phlo services via Docker labels, through the read-only
  # prometheus-docker proxy. Services opt in with phlo.metrics.enabled=true.
  - job_name: "phlo-services"
    docker_sd_configs:
      - host: "http://prometheus-docker:2375"
        refresh_interval: 30s
    relabel_configs:
      # Only scrape containers with phlo.metrics.enabled=true
      - source_labels: [__meta_docker_container_label_phlo_metrics_enabled]
        regex: "true"
        action: keep
      # Use container name as job label
      - source_labels: [__meta_docker_container_name]
        regex: "/?(.*)"
        target_label: container
      # Use custom port if specified, else default to 8080
      - source_labels: [__meta_docker_container_label_phlo_metrics_port]
        regex: "(.+)"
        target_label: __address__
        replacement: "${1}"
      # Use custom metrics path if specified
      - source_labels: [__meta_docker_container_label_phlo_metrics_path]
        regex: "(.+)"
        target_label: __metrics_path__
      # Extract service name from compose label
      - source_labels:
          [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      # Extract project name
      - source_labels:
          [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
