name: phlo-api
description: Phlo API - Backend service exposing phlo internals to Observatory
category: api
default: false
profile: api
phlo_dev: true

image: ghcr.io/phlohouse/phlo-api:0.17.0
build:
    context: .
    dockerfile: phlo-api/Dockerfile
    args:
        PHLO_VERSION: ${PHLO_VERSION:-}
        PHLO_API_VERSION: ${PHLO_API_VERSION:-}
        PHLO_WHEELHOUSE: ${PHLO_WHEELHOUSE:-}

depends_on:
    - postgres

compose:
    restart: unless-stopped
    labels:
        traefik.enable: "true"
        traefik.http.routers.phlo-api.rule: "Host(`api.${TRAEFIK_DOMAIN:-phlo.localhost}`) && !PathPrefix(`/oauth2/`)"
        traefik.http.routers.phlo-api.entrypoints: "web"
        traefik.http.routers.phlo-api.middlewares: "phlo-api-login,phlo-api-auth"
        traefik.http.routers.phlo-api.service: "phlo-api"
        traefik.http.services.phlo-api.loadbalancer.server.port: "4000"
        traefik.http.middlewares.phlo-api-auth.forwardauth.address: "http://oauth2-proxy:4180/oauth2/auth"
        traefik.http.middlewares.phlo-api-auth.forwardauth.trustForwardHeader: "false"
        traefik.http.middlewares.phlo-api-auth.forwardauth.authResponseHeaders: "X-Auth-Request-Access-Token"
        traefik.http.middlewares.phlo-api-auth.forwardauth.addAuthCookiesToResponse: "${OAUTH2_PROXY_AUTH_COOKIES:-_oauth2_proxy}"
        traefik.http.middlewares.phlo-api-login.errors.status: "401"
        traefik.http.middlewares.phlo-api-login.errors.statusRewrites.401: "302"
        traefik.http.middlewares.phlo-api-login.errors.service: "oauth2-proxy@docker"
        traefik.http.middlewares.phlo-api-login.errors.query: "/oauth2/sign_in?rd={url}"
        phlo.metrics.enabled: "true"
        phlo.metrics.port: "phlo-api:4000"
        phlo.metrics.path: "/api/maintenance/metrics"
    environment:
        HOST: 0.0.0.0
        PORT: 4000
        PYTHONUNBUFFERED: "1"
        PHLO_AUTHORIZATION_MODE: ${PHLO_AUTHORIZATION_MODE:-required}
        PHLO_AUTHENTICATION_PROVIDER: ${PHLO_AUTHENTICATION_PROVIDER:-}
        PHLO_SERVICE_CREDENTIALS_FILE: ${PHLO_SERVICE_CREDENTIALS_FILE:-}
        PHLO_IDENTITY_AUTHORITY_ENABLED: ${PHLO_IDENTITY_AUTHORITY_ENABLED:-1}
        PHLO_AUTH_JWT_SECRET: ${PHLO_AUTH_JWT_SECRET:-}
        PHLO_AUTH_JWT_ISSUER: ${PHLO_AUTH_JWT_ISSUER:-}
        PHLO_AUTH_JWT_AUDIENCE: ${PHLO_AUTH_JWT_AUDIENCE:-}
        PHLO_AUTH_JWT_JWKS_URL: ${PHLO_AUTH_JWT_JWKS_URL:-}
        PHLO_AUTH_JWT_GROUPS_CLAIM: ${PHLO_AUTH_JWT_GROUPS_CLAIM:-groups}
        PHLO_AUTH_JWT_CA_FILE: ${PHLO_AUTH_JWT_CA_FILE:-}
        PHLO_AUTH_JWT_LEEWAY: ${PHLO_AUTH_JWT_LEEWAY:-30}
        PHLO_AUTH_JWT_JWKS_CACHE_TTL_SECONDS: ${PHLO_AUTH_JWT_JWKS_CACHE_TTL_SECONDS:-300}
        PHLO_AUTH_JWT_REFRESH_MIN_INTERVAL_SECONDS: ${PHLO_AUTH_JWT_REFRESH_MIN_INTERVAL_SECONDS:-5}
        PHLO_SIGNATURE_HMAC_KEY: ${PHLO_SIGNATURE_HMAC_KEY:-}
        PHLO_V1_ENVIRONMENTS: ${PHLO_V1_ENVIRONMENTS:-}
        PHLO_V1_MAINTENANCE_WINDOWS: ${PHLO_V1_MAINTENANCE_WINDOWS:-}
        PHLO_V1_PREVIEW_SERVER_LIMITS_CONFIGURED: ${PHLO_V1_PREVIEW_SERVER_LIMITS_CONFIGURED:-}
        PHLO_V1_PREVIEW_TRINO_PASSWORD_PROD: ${PHLO_V1_PREVIEW_TRINO_PASSWORD_PROD:-}
        PHLO_V1_PREVIEW_TRINO_PASSWORD_STAGING: ${PHLO_V1_PREVIEW_TRINO_PASSWORD_STAGING:-}
        PHLO_V1_PREVIEW_CATALOGS: ${PHLO_V1_PREVIEW_CATALOGS:-}
        PHLO_V1_QUERY_SINGLE_REPLICA: ${PHLO_V1_QUERY_SINGLE_REPLICA:-}
        PHLO_V1_USAGE_TRINO_SOURCES: ${PHLO_V1_USAGE_TRINO_SOURCES:-}
        PHLO_V1_GIT_REVIEW_REPOSITORY: ${PHLO_V1_GIT_REVIEW_REPOSITORY:-}
        PHLO_V1_GIT_REVIEW_BASE_BRANCH: ${PHLO_V1_GIT_REVIEW_BASE_BRANCH:-}
        PHLO_V1_GIT_REVIEW_TOKEN: ${PHLO_V1_GIT_REVIEW_TOKEN:-}
        PHLO_V1_ACTIONS_SINGLE_REPLICA: ${PHLO_V1_ACTIONS_SINGLE_REPLICA:-}
        PHLO_V1_ACTIONS_SINGLE_PROCESS: ${PHLO_V1_ACTIONS_SINGLE_PROCESS:-}
        PHLO_V1_ACTIONS_REF_TAG_CONTRACT: ${PHLO_V1_ACTIONS_REF_TAG_CONTRACT:-}
        PHLO_V1_BRANCH_CHECK_JOBS: ${PHLO_V1_BRANCH_CHECK_JOBS:-}
        POSTGRES_HOST: postgres
        POSTGRES_PORT: "5432"
        POSTGRES_USER: ${POSTGRES_USER:-phlo}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run phlo services init to generate POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB:-phlo}
        TRINO_URL: ${TRINO_URL:-http://trino:8080}
        DAGSTER_GRAPHQL_URL: ${DAGSTER_GRAPHQL_URL:-http://dagster:3000/graphql}
        NESSIE_URL: ${NESSIE_URL:-http://nessie:19120/api/v2}
        CLICKSTACK_QUERY_URL: ${CLICKSTACK_QUERY_URL:-}
        CLICKSTACK_QUERY_USER: ${CLICKSTACK_QUERY_USER:-}
        CLICKSTACK_QUERY_PASSWORD: ${CLICKSTACK_QUERY_PASSWORD:-}
        PHLO_PROJECT_PATH: /app
        PHLO_RUN_EVIDENCE_DB_URL: postgresql://${POSTGRES_USER:-phlo}:${POSTGRES_PASSWORD:?Run phlo services init to generate POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-phlo}
    ports:
        - "${PHLO_API_PORT:-4000}:4000"
    volumes:
        - ../:/app:ro
        - ./logs:/app/.phlo/logs
        # API-managed state must remain writable while the project definition
        # itself stays immutable inside a release container.
        - ../.phlo/observatory:/app/.phlo/observatory
        - ../.phlo/state:/app/.phlo/state
        - ../.phlo/audit:/app/.phlo/audit
    healthcheck:
        test:
            [
                "CMD",
                "python",
                "-c",
                "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health')",
            ]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 10s

env_vars:
    PHLO_VERSION:
        default: ""
        package: phlo
        description: Phlo package version to install in service images
    PHLO_API_VERSION:
        default: ""
        package: phlo-api
        description: phlo-api package version to install in the service image
    PHLO_API_PORT:
        default: 4000
        description: Phlo API port
    OAUTH2_PROXY_AUTH_COOKIES:
        default: _oauth2_proxy
        description: Comma-separated session cookie names forwarded after refresh; include all chunk names if oauth2-proxy splits a large cookie
    PHLO_AUTHENTICATION_PROVIDER:
        default: ""
        description: Explicit authentication provider selection; use jwt with issuer, audience, and JWKS for human OIDC tokens
    PHLO_AUTH_JWT_SECRET:
        default: ""
        description: Legacy HS256 signing secret for non-production JWT authentication
        secret: true
    PHLO_AUTH_JWT_ISSUER:
        default: ""
        description: Exact OIDC issuer accepted for human JWTs
    PHLO_AUTH_JWT_AUDIENCE:
        default: ""
        description: Required audience for human JWTs (normally phlo-api)
    PHLO_AUTH_JWT_JWKS_URL:
        default: ""
        description: HTTPS JWKS endpoint used to verify issuer-signed RS256 tokens
    PHLO_AUTH_JWT_GROUPS_CLAIM:
        default: groups
        description: OIDC claim containing role/group identifiers
    PHLO_AUTH_JWT_CA_FILE:
        default: ""
        description: Optional CA bundle path for private OIDC JWKS endpoints
    PHLO_AUTH_JWT_LEEWAY:
        default: 30
        description: Bounded clock-skew allowance for OIDC token validation in seconds
    PHLO_AUTH_JWT_JWKS_CACHE_TTL_SECONDS:
        default: 300
        description: Bounded OIDC signing key cache lifetime in seconds
    PHLO_AUTH_JWT_REFRESH_MIN_INTERVAL_SECONDS:
        default: 5
        description: Minimum interval between OIDC JWKS refresh attempts
    PHLO_IDENTITY_AUTHORITY_ENABLED:
        default: "1"
        description: Use Phlo's durable shared identity authority for managed role assignments and service accounts
    PHLO_SIGNATURE_HMAC_KEY:
        default: ""
        description: Secret HMAC key for action-bound signature records
        secret: true
    PHLO_V1_ENVIRONMENTS:
        default: ""
        description: JSON allowlist of distinct prod and staging Dagster locations and Nessie refs
    PHLO_V1_MAINTENANCE_WINDOWS:
        default: ""
        description: Optional JSON mapping prod and staging to bounded ISO-timestamp maintenance windows
    PHLO_V1_PREVIEW_SERVER_LIMITS_CONFIGURED:
        default: ""
        description: Explicit assertion that Trino preview authentication and server-side limits are deployed and verified
    PHLO_V1_PREVIEW_TRINO_PASSWORD_PROD:
        default: ""
        description: Password for the prod-only Trino preview identity phlo_api_preview_prod
        secret: true
    PHLO_V1_PREVIEW_TRINO_PASSWORD_STAGING:
        default: ""
        description: Password for the staging-only Trino preview identity phlo_api_preview_staging
        secret: true
    PHLO_V1_PREVIEW_CATALOGS:
        default: ""
        description: JSON allowlist mapping prod and staging to distinct pre-provisioned Nessie-ref-pinned Trino catalogs
    PHLO_V1_QUERY_SINGLE_REPLICA:
        default: ""
        description: Explicit operator assertion that this API deployment has exactly one replica for query sessions and saved-query writes
    PHLO_V1_GIT_REVIEW_REPOSITORY:
        default: ""
        description: Explicit customer project repository in owner/repo form for source-only check draft PRs
    PHLO_V1_GIT_REVIEW_BASE_BRANCH:
        default: ""
        description: Explicit base branch for source-only check draft PRs in the configured project repository
    PHLO_V1_GIT_REVIEW_TOKEN:
        default: ""
        description: Repository-scoped credential with contents write and pull request write permissions for draft check proposals
        secret: true
    PHLO_V1_ACTIONS_SINGLE_REPLICA:
        default: ""
        description: Operator assertion that the API is deployed as one replica
    PHLO_V1_ACTIONS_SINGLE_PROCESS:
        default: ""
        description: Operator assertion that the API runs as one worker process
    PHLO_V1_ACTIONS_REF_TAG_CONTRACT:
        default: ""
        description: Operator assertion that Dagster locations enforce environment and Nessie-ref run tags
    PHLO_V1_BRANCH_CHECK_JOBS:
        default: ""
        description: JSON map of prod and staging to Dagster test, contract and audit check job names

files:
    - source: Dockerfile
      dest: phlo-api/Dockerfile
    - source: entrypoint.sh
      dest: phlo-api/entrypoint.sh

# Dev mode: run as subprocess (no Docker)
dev:
    command:
        [
            "python",
            "-m",
            "uvicorn",
            "phlo_api.main:app",
            "--host",
            "0.0.0.0",
            "--port",
            "4000",
        ]
    environment:
        PYTHONUNBUFFERED: "1"
        PHLO_DEV_MODE: "true"
        PHLO_IDENTITY_AUTHORITY_ENABLED: ${PHLO_IDENTITY_AUTHORITY_ENABLED:-1}
        PHLO_AUTHENTICATION_PROVIDER: ${PHLO_AUTHENTICATION_PROVIDER:-}
        PHLO_AUTH_JWT_SECRET: ${PHLO_AUTH_JWT_SECRET:-}
        PHLO_AUTH_JWT_ISSUER: ${PHLO_AUTH_JWT_ISSUER:-}
        PHLO_AUTH_JWT_AUDIENCE: ${PHLO_AUTH_JWT_AUDIENCE:-}
        PHLO_AUTH_JWT_JWKS_URL: ${PHLO_AUTH_JWT_JWKS_URL:-}
        PHLO_AUTH_JWT_GROUPS_CLAIM: ${PHLO_AUTH_JWT_GROUPS_CLAIM:-groups}
        PHLO_AUTH_JWT_CA_FILE: ${PHLO_AUTH_JWT_CA_FILE:-}
        PHLO_AUTH_JWT_LEEWAY: ${PHLO_AUTH_JWT_LEEWAY:-30}
        PHLO_AUTH_JWT_JWKS_CACHE_TTL_SECONDS: ${PHLO_AUTH_JWT_JWKS_CACHE_TTL_SECONDS:-300}
        PHLO_AUTH_JWT_REFRESH_MIN_INTERVAL_SECONDS: ${PHLO_AUTH_JWT_REFRESH_MIN_INTERVAL_SECONDS:-5}
        DAGSTER_GRAPHQL_URL: "http://127.0.0.1:${DAGSTER_PORT:-10006}/graphql"
        NESSIE_URL: "http://127.0.0.1:${NESSIE_PORT:-10003}/api/v2"
        PHLO_V1_ENVIRONMENTS: ${PHLO_V1_ENVIRONMENTS:-}
        PHLO_V1_MAINTENANCE_WINDOWS: ${PHLO_V1_MAINTENANCE_WINDOWS:-}
        PHLO_V1_PREVIEW_SERVER_LIMITS_CONFIGURED: ${PHLO_V1_PREVIEW_SERVER_LIMITS_CONFIGURED:-}
        PHLO_V1_PREVIEW_TRINO_PASSWORD_PROD: ${PHLO_V1_PREVIEW_TRINO_PASSWORD_PROD:-}
        PHLO_V1_PREVIEW_TRINO_PASSWORD_STAGING: ${PHLO_V1_PREVIEW_TRINO_PASSWORD_STAGING:-}
        PHLO_V1_PREVIEW_CATALOGS: ${PHLO_V1_PREVIEW_CATALOGS:-}
        PHLO_V1_QUERY_SINGLE_REPLICA: ${PHLO_V1_QUERY_SINGLE_REPLICA:-}
        PHLO_V1_GIT_REVIEW_REPOSITORY: ${PHLO_V1_GIT_REVIEW_REPOSITORY:-}
        PHLO_V1_GIT_REVIEW_BASE_BRANCH: ${PHLO_V1_GIT_REVIEW_BASE_BRANCH:-}
        PHLO_V1_GIT_REVIEW_TOKEN: ${PHLO_V1_GIT_REVIEW_TOKEN:-}
        PHLO_V1_ACTIONS_SINGLE_REPLICA: ${PHLO_V1_ACTIONS_SINGLE_REPLICA:-}
        PHLO_V1_ACTIONS_SINGLE_PROCESS: ${PHLO_V1_ACTIONS_SINGLE_PROCESS:-}
        PHLO_V1_ACTIONS_REF_TAG_CONTRACT: ${PHLO_V1_ACTIONS_REF_TAG_CONTRACT:-}
        PHLO_V1_BRANCH_CHECK_JOBS: ${PHLO_V1_BRANCH_CHECK_JOBS:-}
        POSTGRES_HOST: 127.0.0.1
        POSTGRES_PORT: ${POSTGRES_PORT:-10000}
        POSTGRES_USER: ${POSTGRES_USER:-phlo}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run phlo services init to generate POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB:-phlo}
        TRINO_URL: "http://127.0.0.1:${TRINO_PORT:-10005}"
        TRINO_USER: ${PHLO_API_TRINO_USER:-phlo-api}
        TRINO_ROLE: ${PHLO_API_TRINO_ROLE:-}
        CLICKSTACK_QUERY_URL: ${CLICKSTACK_QUERY_URL:-}
        CLICKSTACK_QUERY_USER: ${CLICKSTACK_QUERY_USER:-}
        CLICKSTACK_QUERY_PASSWORD: ${CLICKSTACK_QUERY_PASSWORD:-}
    health_check: "http://127.0.0.1:4000/health"
    cwd: "{project_root}"
