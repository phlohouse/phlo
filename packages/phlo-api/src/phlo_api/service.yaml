name: phlo-api
description: Phlo API - Backend service exposing phlo internals to Observatory
category: api
default: false
profile: api
phlo_dev: true

image: ghcr.io/phlohouse/phlo-api:0.17.0
build:
    context: .
    dockerfile: phlo-api/Dockerfile
    args:
        PHLO_VERSION: ${PHLO_VERSION:-}
        PHLO_API_VERSION: ${PHLO_API_VERSION:-}
        PHLO_WHEELHOUSE: ${PHLO_WHEELHOUSE:-}

depends_on:
    - postgres

compose:
    restart: unless-stopped
    labels:
        phlo.metrics.enabled: "true"
        phlo.metrics.port: "phlo-api:4000"
        phlo.metrics.path: "/api/maintenance/metrics"
    environment:
        HOST: 0.0.0.0
        PORT: 4000
        PYTHONUNBUFFERED: "1"
        PHLO_AUTHORIZATION_MODE: ${PHLO_AUTHORIZATION_MODE:-required}
        PHLO_SERVICE_CREDENTIALS_FILE: ${PHLO_SERVICE_CREDENTIALS_FILE:-}
        PHLO_V1_ENVIRONMENTS: ${PHLO_V1_ENVIRONMENTS:-}
        PHLO_V1_PREVIEW_SERVER_LIMITS_CONFIGURED: ${PHLO_V1_PREVIEW_SERVER_LIMITS_CONFIGURED:-}
        PHLO_V1_PREVIEW_TRINO_USER: ${PHLO_V1_PREVIEW_TRINO_USER:-}
        PHLO_V1_PREVIEW_CATALOGS: ${PHLO_V1_PREVIEW_CATALOGS:-}
        PHLO_V1_ACTIONS_SINGLE_REPLICA: ${PHLO_V1_ACTIONS_SINGLE_REPLICA:-}
        PHLO_V1_ACTIONS_SINGLE_PROCESS: ${PHLO_V1_ACTIONS_SINGLE_PROCESS:-}
        PHLO_V1_ACTIONS_REF_TAG_CONTRACT: ${PHLO_V1_ACTIONS_REF_TAG_CONTRACT:-}
        TRINO_URL: ${TRINO_URL:-http://trino:8080}
        DAGSTER_GRAPHQL_URL: ${DAGSTER_GRAPHQL_URL:-http://dagster:3000/graphql}
        NESSIE_URL: ${NESSIE_URL:-http://nessie:19120/api/v2}
        CLICKSTACK_QUERY_URL: ${CLICKSTACK_QUERY_URL:-}
        CLICKSTACK_QUERY_USER: ${CLICKSTACK_QUERY_USER:-}
        CLICKSTACK_QUERY_PASSWORD: ${CLICKSTACK_QUERY_PASSWORD:-}
        PHLO_PROJECT_PATH: /app
        PHLO_RUN_EVIDENCE_DB_URL: postgresql://${POSTGRES_USER:-phlo}:${POSTGRES_PASSWORD:-phlo}@postgres:5432/${POSTGRES_DB:-phlo}
    ports:
        - "${PHLO_API_PORT:-4000}:4000"
    volumes:
        - ../:/app:ro
        - ./logs:/app/.phlo/logs
        # API-managed state must remain writable while the project definition
        # itself stays immutable inside a release container.
        - ../.phlo/observatory:/app/.phlo/observatory
        - ../.phlo/state:/app/.phlo/state
    healthcheck:
        test:
            [
                "CMD",
                "python",
                "-c",
                "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health')",
            ]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 10s

env_vars:
    PHLO_VERSION:
        default: ""
        package: phlo
        description: Phlo package version to install in service images
    PHLO_API_VERSION:
        default: ""
        package: phlo-api
        description: phlo-api package version to install in the service image
    PHLO_API_PORT:
        default: 4000
        description: Phlo API port
    PHLO_V1_ENVIRONMENTS:
        default: ""
        description: JSON allowlist of distinct prod and staging Dagster locations and Nessie refs
    PHLO_V1_PREVIEW_SERVER_LIMITS_CONFIGURED:
        default: ""
        description: Explicit assertion that Trino preview authentication and server-side limits are deployed and verified
    PHLO_V1_PREVIEW_TRINO_USER:
        default: ""
        description: Dedicated Trino identity for read-only bounded asset preview
    PHLO_V1_PREVIEW_CATALOGS:
        default: ""
        description: JSON allowlist mapping prod and staging to distinct pre-provisioned Nessie-ref-pinned Trino catalogs
    PHLO_V1_ACTIONS_SINGLE_REPLICA:
        default: ""
        description: Operator assertion that the API is deployed as one replica
    PHLO_V1_ACTIONS_SINGLE_PROCESS:
        default: ""
        description: Operator assertion that the API runs as one worker process
    PHLO_V1_ACTIONS_REF_TAG_CONTRACT:
        default: ""
        description: Operator assertion that Dagster locations enforce environment and Nessie-ref run tags

files:
    - source: Dockerfile
      dest: phlo-api/Dockerfile
    - source: entrypoint.sh
      dest: phlo-api/entrypoint.sh

# Dev mode: run as subprocess (no Docker)
dev:
    command:
        [
            "python",
            "-m",
            "uvicorn",
            "phlo_api.main:app",
            "--host",
            "0.0.0.0",
            "--port",
            "4000",
        ]
    environment:
        PYTHONUNBUFFERED: "1"
        PHLO_DEV_MODE: "true"
        DAGSTER_GRAPHQL_URL: "http://127.0.0.1:${DAGSTER_PORT:-10006}/graphql"
        NESSIE_URL: "http://127.0.0.1:${NESSIE_PORT:-10003}/api/v2"
        PHLO_V1_ENVIRONMENTS: ${PHLO_V1_ENVIRONMENTS:-}
        PHLO_V1_PREVIEW_SERVER_LIMITS_CONFIGURED: ${PHLO_V1_PREVIEW_SERVER_LIMITS_CONFIGURED:-}
        PHLO_V1_PREVIEW_TRINO_USER: ${PHLO_V1_PREVIEW_TRINO_USER:-}
        PHLO_V1_PREVIEW_CATALOGS: ${PHLO_V1_PREVIEW_CATALOGS:-}
        PHLO_V1_ACTIONS_SINGLE_REPLICA: ${PHLO_V1_ACTIONS_SINGLE_REPLICA:-}
        PHLO_V1_ACTIONS_SINGLE_PROCESS: ${PHLO_V1_ACTIONS_SINGLE_PROCESS:-}
        PHLO_V1_ACTIONS_REF_TAG_CONTRACT: ${PHLO_V1_ACTIONS_REF_TAG_CONTRACT:-}
        TRINO_URL: "http://127.0.0.1:${TRINO_PORT:-10005}"
        TRINO_USER: ${PHLO_API_TRINO_USER:-phlo-api}
        TRINO_ROLE: ${PHLO_API_TRINO_ROLE:-}
        CLICKSTACK_QUERY_URL: ${CLICKSTACK_QUERY_URL:-}
        CLICKSTACK_QUERY_USER: ${CLICKSTACK_QUERY_USER:-}
        CLICKSTACK_QUERY_PASSWORD: ${CLICKSTACK_QUERY_PASSWORD:-}
    health_check: "http://127.0.0.1:4000/health"
    cwd: "{project_root}"
