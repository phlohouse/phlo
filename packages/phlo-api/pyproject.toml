[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=45",
    "wheel",
]

[project]
dependencies = [
    "phlo>=0.15.0,<0.16",
    "fastapi>=0.127.0",
    "httpx>=0.28.1",
    "anyio>=4.11.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.0",
    "pyyaml>=6.0.1",
    "uvicorn>=0.38.0",
]
description = "Phlo API - Backend service exposing Phlo internals to Observatory"
name = "phlo-api"
requires-python = ">=3.11"
version = "0.15.0"

[[project.authors]]
email = "team@phlo.dev"
name = "Phlo Team"

[project.entry-points."phlo.plugins.services"]
phlo-api = "phlo_api.plugin:PhloApiServicePlugin"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
lineage = ["phlo-lineage>=0.1.0"]

[project.readme]
content-type = "text/plain"
text = "Phlo API backend for Observatory."

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
phlo_api = [
    "service.yaml",
    "Dockerfile",
    "entrypoint.sh",
    "observatory_api/**/*.py",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
