# Companion service for dagster - runs the daemon for schedules/sensors
name: dagster-daemon
description: Dagster daemon for schedules, sensors, and run queue
category: orchestration
default: true
phlo_dev: true

image: ghcr.io/phlohouse/phlo-dagster:0.16.0
build:
  context: .
  dockerfile: dagster/Dockerfile
  args:
    PHLO_VERSION: ${PHLO_VERSION:-}
    PHLO_DBT_VERSION: ${PHLO_DBT_VERSION:-}
    PHLO_DAGSTER_VERSION: ${PHLO_DAGSTER_VERSION:-}
    PHLO_WHEELHOUSE: ${PHLO_WHEELHOUSE:-}
    PHLO_UV_LOCKED: ${PHLO_UV_LOCKED:-}

depends_on:
  - dagster

compose:
  restart: unless-stopped
  environment:
    DAGSTER_HOME: /opt/dagster
    PYTHONPATH: /opt/dagster:/app
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
    AWS_REGION: us-east-1
    AWS_S3_ENDPOINT: http://minio:9000
    AWS_S3_USE_SSL: "false"
    AWS_S3_URL_STYLE: "path"
    ICEBERG_S3_ACCESS_KEY: ${DAGSTER_MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minio}}
    ICEBERG_S3_SECRET_KEY: ${DAGSTER_MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minio123}}
    ICEBERG_S3_ENDPOINT: http://minio:9000
    ICEBERG_S3_REGION: us-east-1
    NESSIE_HOST: nessie
    NESSIE_PORT: 19120
    TRINO_HOST: trino
    TRINO_PORT: 8080
    TRINO_CATALOG: iceberg
    ICEBERG_WAREHOUSE_PATH: s3://lake/warehouse
    ICEBERG_STAGING_PATH: s3://lake/stage
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${POSTGRES_USER:-phlo}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phlo}
    POSTGRES_DB: ${POSTGRES_DB:-phlo}
    PHLO_RUN_EVIDENCE_DB_URL: postgresql://${POSTGRES_USER:-phlo}:${POSTGRES_PASSWORD:-phlo}@postgres:5432/${POSTGRES_DB:-phlo}
    WORKFLOWS_PATH: /app/workflows
    PHLO_WORKFLOWS_PATH: /app/workflows
    PHLO_PROJECT_PATH: /app
    PHLO_PROJECT: ${PHLO_PROJECT:-}
    SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
    PHLO_HOST_PLATFORM: ${PHLO_HOST_PLATFORM:-}
    DISABLE_PANDERA_IMPORT_WARNING: "True"
  command: ["dagster-daemon", "run", "-w", "/opt/dagster/workspace.yaml"]
  volumes:
    - ./dagster:/opt/dagster
    - ../:/app
