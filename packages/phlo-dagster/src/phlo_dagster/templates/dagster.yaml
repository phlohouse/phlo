storage:
  postgres:
    postgres_db:
      hostname:
        env: POSTGRES_HOST
      port:
        env: POSTGRES_PORT
      username:
        env: POSTGRES_USER
      password:
        env: POSTGRES_PASSWORD
      db_name:
        env: POSTGRES_DB

run_coordinator:
  module: phlo_dagster.daemon_identity
  class: PhloQueuedRunCoordinator

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

# Required for run cancellation: the daemon only terminates runs marked
# CANCELING when monitoring is enabled. A short poll/cancel timeout keeps
# operator-driven cancellation responsive in disposable environments.
run_monitoring:
  enabled: true
  poll_interval_seconds: 5
  cancel_timeout_seconds: 30

sensors:
  use_threads: true
  num_workers: 4

schedules:
  use_threads: true
  num_workers: 4
