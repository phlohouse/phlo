name: dagster
description: Data orchestration platform for workflows and pipelines
category: orchestration
default: true
phlo_dev: true
gitignore:
  - dagster/storage/
  - dagster/history/
  - dagster/schedules/
  - dagster/logs/

image: ghcr.io/phlohouse/phlo-dagster:0.16.0
build:
  context: .
  dockerfile: dagster/Dockerfile
  args:
    PHLO_VERSION: ${PHLO_VERSION:-}
    PHLO_DBT_VERSION: ${PHLO_DBT_VERSION:-}
    PHLO_DAGSTER_VERSION: ${PHLO_DAGSTER_VERSION:-}
    PHLO_WHEELHOUSE: ${PHLO_WHEELHOUSE:-}
    PHLO_UV_LOCKED: ${PHLO_UV_LOCKED:-}

depends_on:
  - postgres
  - minio
  - nessie
  - trino

compose:
  restart: unless-stopped
  # Keep the image entrypoint outside the bind-mounted DAGSTER_HOME directory.
  # That lets both development and released stacks use the same bootstrap script.
  entrypoint: ["/usr/local/bin/phlo-dagster-entrypoint.sh"]
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import urllib.request; raise SystemExit(urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=3).status != 200)",
      ]
    interval: 30s
    timeout: 5s
    retries: 3
    # Editable project installs and Dagster definition loading can exceed the
    # short Docker default on a cold bundled-stack boot.
    start_period: 120s
  labels:
    phlo.metrics.enabled: "true"
    phlo.metrics.port: "dagster:3000"
    phlo.metrics.path: "/metrics"
    traefik.enable: "true"
    traefik.http.routers.dagster.rule: "Host(`dagster.${TRAEFIK_DOMAIN:-phlo.localhost}`)"
    traefik.http.routers.dagster.entrypoints: "web"
    traefik.http.services.dagster.loadbalancer.server.port: "3000"
  environment:
    DAGSTER_HOME: /opt/dagster
    PYTHONPATH: /opt/dagster:/app
    PHLO_SERVICE_CREDENTIALS_FILE: ${PHLO_SERVICE_CREDENTIALS_FILE:-}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    AWS_ACCESS_KEY_ID: ${DAGSTER_MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minio}}
    AWS_SECRET_ACCESS_KEY: ${DAGSTER_MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minio123}}
    AWS_REGION: us-east-1
    AWS_S3_ENDPOINT: http://minio:9000
    AWS_S3_USE_SSL: "false"
    AWS_S3_URL_STYLE: "path"
    ICEBERG_S3_ACCESS_KEY: ${DAGSTER_MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minio}}
    ICEBERG_S3_SECRET_KEY: ${DAGSTER_MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minio123}}
    ICEBERG_S3_ENDPOINT: http://minio:9000
    ICEBERG_S3_REGION: us-east-1
    NESSIE_HOST: nessie
    NESSIE_PORT: 19120
    TRINO_HOST: trino
    TRINO_USER: ${DAGSTER_TRINO_USER:-phlo-dagster}
    TRINO_ROLE: ${DAGSTER_TRINO_ROLE:-}
    TRINO_PORT: 8080
    TRINO_CATALOG: iceberg
    ICEBERG_WAREHOUSE_PATH: s3://lake/warehouse
    ICEBERG_STAGING_PATH: s3://lake/stage
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${DAGSTER_POSTGRES_USER:-${POSTGRES_USER:-phlo}}
    POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:-phlo}}
    POSTGRES_DB: ${POSTGRES_DB:-phlo}
    PHLO_RUN_EVIDENCE_DB_URL: postgresql://${POSTGRES_USER:-phlo}:${POSTGRES_PASSWORD:-phlo}@postgres:5432/${POSTGRES_DB:-phlo}
    PHLO_SERVICE_NONCE_DB_URL: postgresql://${POSTGRES_USER:-phlo}:${POSTGRES_PASSWORD:-phlo}@postgres:5432/${POSTGRES_DB:-phlo}
    WORKFLOWS_PATH: /app/workflows
    PHLO_WORKFLOWS_PATH: /app/workflows
    PHLO_PROJECT_PATH: /app
    PHLO_PROJECT: ${PHLO_PROJECT:-}
    SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
    PHLO_HOST_PLATFORM: ${PHLO_HOST_PLATFORM:-}
    PHLO_DAGSTER_OIDC_ISSUER: ${PHLO_DAGSTER_OIDC_ISSUER:-}
    PHLO_DAGSTER_OIDC_AUDIENCE: ${PHLO_DAGSTER_OIDC_AUDIENCE:-}
    PHLO_DAGSTER_OIDC_JWKS_URL: ${PHLO_DAGSTER_OIDC_JWKS_URL:-}
    PHLO_DAGSTER_OIDC_CA_FILE: ${PHLO_DAGSTER_OIDC_CA_FILE:-}
    PHLO_DAGSTER_OIDC_GROUPS_CLAIM: ${PHLO_DAGSTER_OIDC_GROUPS_CLAIM:-groups}
    PHLO_DAGSTER_OIDC_LEEWAY_SECONDS: ${PHLO_DAGSTER_OIDC_LEEWAY_SECONDS:-30}
    PHLO_DAGSTER_OIDC_JWKS_CACHE_TTL_SECONDS: ${PHLO_DAGSTER_OIDC_JWKS_CACHE_TTL_SECONDS:-300}
    PHLO_DAGSTER_OIDC_REFRESH_MIN_INTERVAL_SECONDS: ${PHLO_DAGSTER_OIDC_REFRESH_MIN_INTERVAL_SECONDS:-5}
    PHLO_DAGSTER_OIDC_REQUIRED: ${PHLO_DAGSTER_OIDC_REQUIRED:-false}
    PHLO_DAGSTER_GRAPHQL_WS_INIT_TIMEOUT_SECONDS: ${PHLO_DAGSTER_GRAPHQL_WS_INIT_TIMEOUT_SECONDS:-10}
    PHLO_SERVICE_SECRET: ${PHLO_SERVICE_SECRET:-}
    DISABLE_PANDERA_IMPORT_WARNING: "True"
  command:
    [
      "python",
      "-m",
      "phlo_dagster.webserver",
      "-h",
      "0.0.0.0",
      "-p",
      "3000",
      "-w",
      "/opt/dagster/workspace.yaml",
    ]
  ports:
    - "${DAGSTER_PORT:-10006}:3000"
  volumes:
    - ./dagster:/opt/dagster
    - ../:/app

env_vars:
  DAGSTER_PORT:
    default: 10006
    description: Dagster webserver host port
  PHLO_VERSION:
    default: ""
    description: Phlo version to install (empty for latest)
  PHLO_UV_LOCKED:
    default: ""
    description: >-
      Build the image from the project's staged uv.lock instead of resolving
      dependencies at build time (staged by phlo services init)
  PHLO_DBT_VERSION:
    default: ""
    package: phlo-dbt
    description: phlo-dbt version to install in the service image
  PHLO_DAGSTER_VERSION:
    default: ""
    package: phlo-dagster
    description: phlo-dagster version to install in the service image
  PHLO_HOST_PLATFORM:
    default: ""
    description: Host platform for executor selection (Darwin/Linux)
  PHLO_PROJECT:
    default: ""
    description: Project identity attached to run and WAP evidence
  PHLO_DAGSTER_OIDC_ISSUER:
    default: ""
    description: OIDC issuer URL accepted for Dagster human access
  PHLO_DAGSTER_OIDC_AUDIENCE:
    default: ""
    description: OIDC audience required in the Dagster access token
  PHLO_DAGSTER_OIDC_JWKS_URL:
    default: ""
    description: Pinned OIDC JWKS endpoint used to verify RS256 signing keys
  PHLO_DAGSTER_OIDC_CA_FILE:
    default: ""
    description: CA bundle mounted into Dagster for TLS verification of the OIDC JWKS endpoint
  PHLO_DAGSTER_OIDC_LEEWAY_SECONDS:
    default: "30"
    description: Bounded clock-skew allowance for Dagster OIDC token validation
  PHLO_DAGSTER_OIDC_JWKS_CACHE_TTL_SECONDS:
    default: "300"
    description: Bounded positive-cache lifetime for Dagster OIDC signing keys
  PHLO_DAGSTER_OIDC_REFRESH_MIN_INTERVAL_SECONDS:
    default: "5"
    description: Minimum interval between Dagster JWKS refresh attempts
  PHLO_DAGSTER_OIDC_GROUPS_CLAIM:
    default: "groups"
    description: OIDC claim containing the allow-listed Dagster groups
  PHLO_DAGSTER_OIDC_REQUIRED:
    default: "false"
    description: Set true in regulated generation to require complete HTTPS OIDC/JWKS configuration at startup
  PHLO_DAGSTER_GRAPHQL_WS_INIT_TIMEOUT_SECONDS:
    default: "10"
    description: Seconds allowed for graphql-ws connection_init before the socket is closed (maximum 60)
  PHLO_SERVICE_SECRET:
    default: ""
    description: Development-only HMAC secret for trusted local service calls

hooks:
  post_start:
    - name: dbt-compile
      requires: phlo_dbt
      command:
        - python3
        - -m
        - phlo_dbt.hooks
        - compile
      timeout_seconds: 180

files:
  - source: Dockerfile
    dest: dagster/Dockerfile
  - source: entrypoint.sh
    dest: dagster/entrypoint.sh
  - source: templates/workspace.yaml
    dest: dagster/workspace.yaml
  - source: templates/dagster.yaml
    dest: dagster/dagster.yaml
