# Persistent, reloadable code location shared by the webserver and daemon.
name: dagster-code
description: Dagster workflow code server
category: orchestration
default: true
phlo_dev: true
image: ghcr.io/phlohouse/phlo-dagster:0.18.0
build:
  context: .
  dockerfile: dagster/Dockerfile
  args:
    PHLO_VERSION: ${PHLO_VERSION:-}
    PHLO_DBT_VERSION: ${PHLO_DBT_VERSION:-}
    PHLO_DAGSTER_VERSION: ${PHLO_DAGSTER_VERSION:-}
    PHLO_WHEELHOUSE: ${PHLO_WHEELHOUSE:-}
    PHLO_UV_LOCKED: ${PHLO_UV_LOCKED:-}
depends_on:
  - postgres
  - minio
  - nessie
  - trino
networks:
  default: {}
  dagster-code:
    internal: true
compose:
  restart: unless-stopped
  entrypoint: ["/usr/local/bin/phlo-dagster-entrypoint.sh"]
  # Bind gRPC only to this network's interface, not the shared data network.
  networks:
    default: {}
    dagster-code:
      aliases: [dagster-code-private]
  command:
    ["dagster", "code-server", "start", "-h", "dagster-code-private", "-p", "4000", "-m", "phlo_dagster.framework.definitions", "-d", "/app"]
  healthcheck:
    # The image's sitecustomize imports Dagster. Probe the same standard gRPC
    # health service without that application startup on every health tick.
    test:
      - CMD
      - python
      - -S
      - -c
      - |
        import sys
        from pathlib import Path
        sys.path.append(str(Path(sys.executable).parent.parent / "lib" / f"python{sys.version_info.major}.{sys.version_info.minor}" / "site-packages"))
        import grpc
        from grpc_health.v1 import health_pb2, health_pb2_grpc
        with grpc.insecure_channel(sys.argv[1]) as channel:
            response = health_pb2_grpc.HealthStub(channel).Check(health_pb2.HealthCheckRequest(service="DagsterApi"))
        raise SystemExit(response.status != health_pb2.HealthCheckResponse.SERVING)
      - dagster-code-private:4000
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 120s
  environment:
    DAGSTER_HOME: /opt/dagster
    PYTHONPATH: /opt/dagster:/app
    PHLO_SERVICE_CREDENTIALS_FILE: ${PHLO_SERVICE_CREDENTIALS_FILE:-}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run phlo services init to generate MINIO_ROOT_PASSWORD}
    AWS_ACCESS_KEY_ID: ${DAGSTER_MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minio}}
    AWS_SECRET_ACCESS_KEY: ${DAGSTER_MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?Run phlo services init to generate MINIO_ROOT_PASSWORD}}
    AWS_REGION: us-east-1
    AWS_S3_ENDPOINT: http://minio:9000
    AWS_S3_USE_SSL: "false"
    AWS_S3_URL_STYLE: "path"
    ICEBERG_S3_ACCESS_KEY: ${DAGSTER_MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minio}}
    ICEBERG_S3_SECRET_KEY: ${DAGSTER_MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?Run phlo services init to generate MINIO_ROOT_PASSWORD}}
    ICEBERG_S3_ENDPOINT: http://minio:9000
    ICEBERG_S3_REGION: us-east-1
    NESSIE_HOST: nessie
    NESSIE_PORT: 19120
    TRINO_HOST: trino
    TRINO_USER: ${DAGSTER_TRINO_USER:-phlo-dagster}
    TRINO_ROLE: ${DAGSTER_TRINO_ROLE:-}
    TRINO_PORT: 8080
    TRINO_CATALOG: iceberg
    ICEBERG_WAREHOUSE_PATH: s3://lake/warehouse
    ICEBERG_STAGING_PATH: s3://lake/stage
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${DAGSTER_POSTGRES_USER:-${POSTGRES_USER:-phlo}}
    POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?Run phlo services init to generate POSTGRES_PASSWORD}}
    POSTGRES_DB: ${POSTGRES_DB:-phlo}
    PHLO_RUN_EVIDENCE_DB_URL: postgresql://${POSTGRES_USER:-phlo}:${POSTGRES_PASSWORD:?Run phlo services init to generate POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-phlo}
    WORKFLOWS_PATH: /app/workflows
    PHLO_WORKFLOWS_PATH: /app/workflows
    PHLO_PROJECT_PATH: /app
    PHLO_PROJECT: ${PHLO_PROJECT:-}
    PHLO_HOST_PLATFORM: ${PHLO_HOST_PLATFORM:-}
    DISABLE_PANDERA_IMPORT_WARNING: "True"
  conditional_environment:
    OBSERVE_HTTP_ENDPOINT:
      OBSERVE_HTTP_ENDPOINT: "http://phlo-observer:8080/v1/events"
      OBSERVE_HTTP_TOKEN: "${OBSERVE_HTTP_TOKEN:-}"
      OBSERVE_HTTP_API_KEY: "${OBSERVE_HTTP_API_KEY:-}"
  volumes:
    - ./dagster:/opt/dagster
    - ../:/app
