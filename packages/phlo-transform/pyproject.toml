[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=45",
    "wheel",
]

[project]
dependencies = ["phlo>=0.16.2,<0.17"]
description = "SQL transform capability provider for Phlo"
name = "phlo-transform"
requires-python = ">=3.11"
version = "0.1.0"

[[project.authors]]
email = "team@phlo.dev"
name = "Phlo Team"

[project.entry-points."phlo.plugins.assets"]
transform = "phlo_transform.plugin:TransformAssetProvider"

[project.entry-points."phlo.plugins.transformation_providers"]
transform = "phlo_transform.plugin:TransformProvider"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.readme]
content-type = "text/markdown"
file = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
