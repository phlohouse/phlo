[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=45",
    "wheel",
]

[project]
dependencies = ["phlo>=0.15.0,<0.16"]
description = "Phlo Observatory - Data platform UI (bundled with phlo core)"
name = "phlo-observatory"
requires-python = ">=3.11"
version = "0.15.0"

[[project.authors]]
email = "team@phlo.dev"
name = "Phlo Team"

[project.entry-points."phlo.plugins.services"]
observatory = "phlo_observatory.plugin:ObservatoryServicePlugin"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
postgres = ["phlo-postgres>=0.1.0"]

[project.readme]
content-type = "text/plain"
text = "Phlo Observatory - Data platform visibility and lineage UI."

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
phlo_observatory = [
    "service.yaml",
    "Dockerfile",
    "README.md",
    "components.json",
    "eslint.config.js",
    "package.json",
    "package-lock.json",
    "prettier.config.js",
    "tsconfig.json",
    "vite.config.ts",
    "context/**",
    "public/**",
    "src/**",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
