name: observatory
description: Phlo Observatory - Data platform visibility and lineage UI
category: orchestration
default: false
profile: api

image: ghcr.io/phlohouse/phlo-observatory:0.18.0
build:
  context: source
  dockerfile: Dockerfile

depends_on:
  - phlo-api

compose:
  restart: unless-stopped
  labels:
    phlo.metrics.enabled: 'false'
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3000
    PHLO_API_URL: http://phlo-api:4000
  ports:
    - '${OBSERVATORY_PORT:-3001}:3000'
  healthcheck:
    test:
      [
        'CMD-SHELL',
        'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/healthz',
      ]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s

env_vars:
  OBSERVATORY_PORT:
    default: 3001
    description: Observatory UI port

dev:
  command:
    - npm
    - run
    - dev
    - --
    - --host
    - 0.0.0.0
    - --port
    - '${OBSERVATORY_PORT:-3001}'
  environment:
    NODE_ENV: development
    PHLO_API_URL: http://127.0.0.1:${PHLO_API_PORT:-4000}
  volumes:
    - '{source_path}:/app'
    - '/app/node_modules'
  cwd: '{source_path}'
