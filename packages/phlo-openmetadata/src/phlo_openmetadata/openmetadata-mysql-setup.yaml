name: openmetadata-mysql
description: OpenMetadata MySQL datastore
category: catalog
default: false
profile: openmetadata

image: docker.io/openmetadata/db:1.13.1@sha256:6659446dba183f1e9364602839dd999c06a83f7d2e905d1c3fb22a74f3e27288

compose:
  restart: unless-stopped
  command: "--sort_buffer_size=10M"
  environment:
    MYSQL_ROOT_PASSWORD: ${OPENMETADATA_DB_ROOT_PASSWORD:?OPENMETADATA_DB_ROOT_PASSWORD is required; run phlo services init}
    OPENMETADATA_DB_PASSWORD: ${OPENMETADATA_DB_PASSWORD:?OPENMETADATA_DB_PASSWORD is required; run phlo services init}
  volumes:
    - ./openmetadata/mysql-credentials.sh:/docker-entrypoint-initdb.d/zz-phlo-credentials.sh:ro
  healthcheck:
    test:
      [
        "CMD",
        "mysqladmin",
        "ping",
        "--silent",
        "--host=127.0.0.1",
        "--user=root",
        "--password=$$MYSQL_ROOT_PASSWORD",
      ]
    interval: 15s
    timeout: 10s
    retries: 10

env_vars:
  OPENMETADATA_DB_ROOT_PASSWORD:
    description: OpenMetadata MySQL root password
    secret: true
  OPENMETADATA_DB_PASSWORD:
    description: OpenMetadata MySQL application user password
    secret: true

files:
  - source: mysql-credentials.sh
    dest: openmetadata/mysql-credentials.sh
