[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=45",
    "wheel",
]

[project]
dependencies = [
    "phlo>=0.15.0,<0.16",
    "requests>=2.32.5",
]
description = "OpenMetadata integration for Phlo"
name = "phlo-openmetadata"
requires-python = ">=3.11"
version = "0.14.0"

[[project.authors]]
email = "team@phlo.dev"
name = "Phlo Team"

[project.entry-points."phlo.plugins.cli"]
openmetadata = "phlo_openmetadata.cli_plugin:OpenMetadataCliPlugin"

[project.entry-points."phlo.plugins.hooks"]
openmetadata = "phlo_openmetadata.hooks_plugin:OpenMetadataHookPlugin"

[project.entry-points."phlo.plugins.resources"]
openmetadata = "phlo_openmetadata.resource_provider:OpenMetadataResourceProvider"

[project.entry-points."phlo.plugins.services"]
openmetadata = "phlo_openmetadata.plugin:OpenMetadataServicePlugin"

[project.license]
text = "MIT"

[project.optional-dependencies]
dbt = ["phlo-dbt>=0.1.0"]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
lineage = ["phlo-lineage>=0.1.0"]
nessie = ["phlo-nessie>=0.1.0"]
postgres = ["phlo-postgres>=0.1.0"]
quality = ["phlo-pandera>=0.1.0"]
trino = ["phlo-trino>=0.1.0"]

[project.readme]
content-type = "text/plain"
text = "OpenMetadata integration for Phlo."

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
phlo_openmetadata = [
    "service.yaml",
    "openmetadata-setup.yaml",
    "openmetadata-mysql-setup.yaml",
    "openmetadata-elasticsearch-setup.yaml",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
