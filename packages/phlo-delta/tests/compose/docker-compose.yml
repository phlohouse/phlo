services:
  minio:
    image: ghcr.io/phlohouse/phlo-minio:0.17.1
    build:
      context: ../../../phlo-minio/src/phlo_minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /bitnami/minio/data --console-address ":9001"
    ports:
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-setup:
    image: ghcr.io/phlohouse/phlo-minio:0.17.1
    build:
      context: ../../../phlo-minio/src/phlo_minio
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb --ignore-existing local/lake
      "

  trino:
    image: trinodb/trino:477
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8080"
    volumes:
      - ./jvm.config:/etc/trino/jvm.config:ro
      - ./delta.properties:/etc/trino/catalog/delta.properties:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
