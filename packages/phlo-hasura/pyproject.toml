[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=45",
    "wheel",
]

[project]
dependencies = [
    "phlo>=0.15.1,<0.16",
    "psycopg2-binary>=2.9.11",
    "pyyaml>=6.0.1",
    "requests>=2.32.5",
]
description = "hasura service plugin for Phlo"
name = "phlo-hasura"
requires-python = ">=3.11"
version = "0.15.1"

[[project.authors]]
email = "team@phlo.dev"
name = "Phlo Team"

[project.entry-points."phlo.plugins.cli"]
hasura = "phlo_hasura.cli_plugin:HasuraCliPlugin"

[project.entry-points."phlo.plugins.resources"]
hasura = "phlo_hasura.resource_provider:HasuraResourceProvider"

[project.entry-points."phlo.plugins.services"]
hasura = "phlo_hasura.plugin:HasuraServicePlugin"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
postgres = ["phlo-postgres>=0.1.0"]

[project.readme]
content-type = "text/plain"
text = "hasura service plugin for Phlo."

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
phlo_hasura = ["service.yaml"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
