name: hasura
description: GraphQL API engine with real-time subscriptions
category: api
default: false
profile: api

image: ${HASURA_IMAGE:-hasura/graphql-engine:v2.49.5@sha256:a9f427a9078b75c5f43ea40abd4ba4e426f45777f862eff7265f411a5ac96086}

depends_on:
  - postgres

compose:
  restart: unless-stopped
  labels:
    phlo.metrics.enabled: "true"
    phlo.metrics.port: "hasura:8080"
    phlo.metrics.path: "/v1/metrics"
  environment:
    HASURA_GRAPHQL_DATABASE_URL: postgresql://${POSTGRES_USER:-phlo}:${POSTGRES_PASSWORD:?Run phlo services init to generate POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-phlo}
    HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
    HASURA_GRAPHQL_DEV_MODE: "true"
    HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
    HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:?Run phlo services init to generate HASURA_ADMIN_SECRET}
    HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
  ports:
    - "${HASURA_PORT:-8082}:8080"
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
    interval: 10s
    timeout: 5s
    retries: 5

env_vars:
  HASURA_IMAGE:
    default: hasura/graphql-engine:v2.49.5@sha256:a9f427a9078b75c5f43ea40abd4ba4e426f45777f862eff7265f411a5ac96086
    description: Complete Hasura GraphQL Engine image reference
  HASURA_PORT:
    default: 8082
    description: Hasura console and API port
  HASURA_ADMIN_SECRET:
    description: Hasura admin secret for console access
    secret: true

hooks:
  post_start:
    - name: track-tables
      delay: 5
      command:
        - python
        - -m
        - phlo_hasura.hooks
        - track-tables
        - auto
      timeout_seconds: 60
