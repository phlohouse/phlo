name: grafana
description: Metrics visualization and dashboards
category: observability
default: false
profile: observability

image: grafana/grafana:13.1.1@sha256:7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b

depends_on:
  - prometheus
  - loki

compose:
  restart: unless-stopped
  labels:
    phlo.metrics.enabled: "true"
    phlo.metrics.port: "grafana:3000"
    phlo.metrics.path: "/metrics"
  environment:
    GF_PLUGINS_PREINSTALL_DISABLED: "true"
    GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
    GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run phlo services init to generate GRAFANA_ADMIN_PASSWORD}
    GF_USERS_ALLOW_SIGN_UP: "false"
  ports:
    - "${GRAFANA_PORT:-3003}:3000"
  volumes:
    - ./grafana/provisioning:/etc/grafana/provisioning:ro
    - ./grafana/dashboards:/etc/grafana/dashboards:ro
    - grafana-data:/var/lib/grafana
  healthcheck:
    test:
      [
        "CMD",
        "wget",
        "--quiet",
        "--tries=1",
        "--spider",
        "http://localhost:3000/api/health",
      ]
    interval: 10s
    timeout: 5s
    retries: 5

env_vars:
  GRAFANA_VERSION:
    default: "13.1.1"
    description: Grafana version
  GRAFANA_PORT:
    default: 3003
    description: Grafana web UI port
  GRAFANA_ADMIN_USER:
    default: admin
    description: Grafana admin username
  GRAFANA_ADMIN_PASSWORD:
    description: Grafana admin password
    secret: true
  GRAFANA_PUBLIC_URL:
    default: ""
    description: Public Grafana base URL used by observability links
  GRAFANA_DASHBOARD_PATH_TEMPLATE:
    default: "/d/{uid}"
    description: Path template used to build dashboard links from dashboard UIDs

files:
  - source: provisioning
    dest: grafana/provisioning
  - source: dashboards
    dest: grafana/dashboards
