[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=45",
    "wheel",
]

[project]
dependencies = ["phlo>=0.15.1,<0.16"]
description = "RustFS service plugin for Phlo"
name = "phlo-rustfs"
requires-python = ">=3.11"
version = "0.15.1"

[[project.authors]]
email = "team@phlo.dev"
name = "Phlo Team"

[project.entry-points."phlo.plugins.resources"]
rustfs = "phlo_rustfs.plugin:RustfsResourceProvider"

[project.entry-points."phlo.plugins.services"]
rustfs = "phlo_rustfs.plugin:RustfsServicePlugin"
rustfs-setup = "phlo_rustfs.plugin:RustfsSetupServicePlugin"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.readme]
content-type = "text/plain"
text = "RustFS S3-compatible object storage service plugin for Phlo."

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
phlo_rustfs = [
    "service.yaml",
    "rustfs-setup.yaml",
    "rustfs-volume-setup.yaml",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
