[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=45",
    "wheel",
]

[project]
dependencies = ["phlo>=0.16.0,<0.17"]
description = "MinIO service plugin for Phlo"
name = "phlo-minio"
requires-python = ">=3.11"
version = "0.15.2"

[[project.authors]]
email = "team@phlo.dev"
name = "Phlo Team"

[project.entry-points."phlo.plugins.cli"]
minio = "phlo_minio.cli_plugin:MinioCliPlugin"

[project.entry-points."phlo.plugins.resources"]
minio = "phlo_minio.plugin:MinioResourceProvider"

[project.entry-points."phlo.plugins.services"]
minio = "phlo_minio.plugin:MinioServicePlugin"
minio-setup = "phlo_minio.plugin:MinioSetupServicePlugin"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.readme]
content-type = "text/plain"
text = "MinIO service plugin for Phlo."

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
phlo_minio = [
    "service.yaml",
    "minio-setup.yaml",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
