# Companion service for minio - prepares writable data volume ownership
name: minio-volume-setup
description: Initialize MinIO data volume permissions
category: core
default: false

image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b

compose:
  restart: "no"
  user: "0:0"
  entrypoint: /bin/sh
  command: >
    -c "
    mkdir -p /bitnami/minio/data &&
    chown -R 1001:0 /bitnami/minio/data &&
    echo 'MinIO data volume ownership initialized'
    "
  volumes:
    - minio-data:/bitnami/minio/data
