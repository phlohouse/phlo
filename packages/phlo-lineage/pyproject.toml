[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=45",
    "wheel",
]

[project]
dependencies = [
    "phlo>=0.14.0,<0.15",
    "psycopg2-binary>=2.9.11",
    "python-ulid>=2.0.0",
    "click>=8.3.0",
    "rich>=14.2.0",
]
description = "Lineage tracking and visualization for Phlo"
name = "phlo-lineage"
requires-python = ">=3.11"
version = "0.14.0"

[[project.authors]]
email = "team@phlo.dev"
name = "Phlo Team"

[project.entry-points."phlo.plugins.cli"]
lineage = "phlo_lineage.cli_plugin:LineageCliPlugin"

[project.entry-points."phlo.plugins.hooks"]
lineage = "phlo_lineage.hooks_plugin:LineageHookPlugin"

[project.entry-points."phlo.plugins.observatory"]
lineage = "phlo_lineage.observatory_plugin:LineageObservatoryExtension"

[project.entry-points."phlo.plugins.resources"]
lineage = "phlo_lineage.resource_provider:LineageResourceProvider"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
observatory = ["phlo-observatory>=0.1.0"]

[project.readme]
content-type = "text/plain"
text = "Lineage tracking and CLI for Phlo."

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
phlo_lineage = [
    "sql/*.sql",
    "observatory_assets/*",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
